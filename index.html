// ── WEEK PLAN FUNCTIONS ──────────────────────────────────────────────────────
const WEEK_DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function getAllRecipesFlat() {
  const all = [];
  state.dinners.forEach(r => all.push({...r, section:"dinner"}));
  state.lunches.forEach(r => all.push({...r, section:"lunch"}));
  state.breakfasts.forEach(r => all.push({...r, section:"breakfast"}));
  return all;
}

function getRecipeById(id) {
  return getAllRecipesFlat().find(r => r.id === id);
}

function assignDay(day, recipeId, section) {
  if (!recipeId) {
    delete state.weekPlan[day];
  } else {
    state.weekPlan[day] = { recipeId, section };
  }
  scheduleSave();
  renderTab("plan");
}

function renderWeekPlanner() {
  const allRecipes = getAllRecipesFlat().filter(r => isActive(r.id));
  const optionsHtml = allRecipes.map(r =>
    `<option value="${r.id}|${r.section}">${r.emoji || ""} ${esc(r.name)}</option>`
  ).join("");

  const totalPrepTime = WEEK_DAYS.reduce((acc, day) => {
    const assignment = state.weekPlan[day];
    if (!assignment) return acc;
    const recipe = getRecipeById(assignment.recipeId);
    if (!recipe) return acc;
    const mins = parseInt((recipe.activeTime || "0").replace(/[^0-9]/g,"")) || 0;
    return acc + mins;
  }, 0);

  const daysHtml = WEEK_DAYS.map(day => {
    const assignment = state.weekPlan[day];
    const recipe = assignment ? getRecipeById(assignment.recipeId) : null;
    return `
      <div style="background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:1.5px solid ${recipe ? "rgba(16,185,129,0.3)" : "rgba(255,255,255,0.06)"}">
        <div style="font-size:12px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">${day}</div>
        ${recipe ? `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <span style="font-size:24px">${recipe.emoji || "🍽️"}</span>
            <div>
              <div style="font-size:15px;font-weight:600;color:var(--text)">${esc(recipe.name)}</div>
              <div style="font-size:12px;color:var(--dim)">${recipe.calories || ""} cal · ${recipe.protein || ""}g protein · ${recipe.activeTime || ""}</div>
            </div>
          </div>` : `<div style="font-size:14px;color:var(--dim);margin-bottom:8px">Nothing planned</div>`}
        <select onchange="(function(e){ const [id,sec] = e.target.value.split('|'); assignDay('${day}', id||'', sec||''); })(event)"
          style="width:100%;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:var(--text);font-size:13px">
          <option value="">— assign a recipe —</option>
          ${optionsHtml}
        </select>
        ${recipe ? `<button onclick="assignDay('${day}','','')" style="width:100%;margin-top:6px;padding:6px;border-radius:8px;border:1px solid rgba(239,68,68,0.3);background:transparent;color:#ef4444;font-size:12px;cursor:pointer">Clear</button>` : ""}
      </div>`;
  }).join("");

  const assignedCount = WEEK_DAYS.filter(d => state.weekPlan[d]).length;
  const totalProtein = WEEK_DAYS.reduce((acc, day) => {
    const assignment = state.weekPlan[day];
    if (!assignment) return acc;
    const recipe = getRecipeById(assignment.recipeId);
    return acc + (recipe ? (recipe.protein || 0) : 0);
  }, 0);

  return `
    <div style="margin-bottom:16px">
      <div style="font-size:20px;font-weight:700;margin-bottom:4px">📅 This Week's Plan</div>
      <div style="color:var(--dim);font-size:14px">Assign recipes to days — grocery list updates automatically</div>
    </div>
    <div class="stats-row" style="margin-bottom:16px">
      <div class="stat-box"><div class="stat-icon">📅</div><div class="stat-val">${assignedCount}</div><div class="stat-label">days planned</div></div>
      <div class="stat-box"><div class="stat-icon">⚡</div><div class="stat-val">${totalPrepTime}</div><div class="stat-label">total min</div></div>
      <div class="stat-box"><div class="stat-icon">💪</div><div class="stat-val">${assignedCount > 0 ? Math.round(totalProtein/assignedCount) : 0}g</div><div class="stat-label">avg protein</div></div>
      <div class="stat-box"><div class="stat-icon">🍽️</div><div class="stat-val">${Object.keys(state.weekPlan).length}</div><div class="stat-label">assigned</div></div>
    </div>
    ${assignedCount > 0 ? `
    <button onclick="clearWeekPlan()" style="width:100%;padding:10px;border-radius:12px;border:1.5px solid rgba(239,68,68,0.3);background:transparent;color:#ef4444;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:14px">
      🗑️ Clear whole week
    </button>` : ""}
    ${daysHtml}
  `;
}

function clearWeekPlan() {
  if (!confirm("Clear all day assignments for this week?")) return;
  state.weekPlan = {}; searchQuery = "";
  scheduleSave();
  renderTab("plan");
}

// ── COOK HISTORY FUNCTIONS ───────────────────────────────────────────────────
function logCook(recipeId, recipeName, rating) {
  if (!state.cookHistory) state.cookHistory = [];
  state.cookHistory.unshift({
    recipeId,
    name: recipeName,
    date: new Date().toISOString().split("T")[0],
    rating: rating || 0
  });
  // Keep last 200 entries
  if (state.cookHistory.length > 200) state.cookHistory = state.cookHistory.slice(0, 200);
  scheduleSave();
}

function renderCookHistory() {
  if (!state.cookHistory || !state.cookHistory.length) {
    return `<div style="text-align:center;padding:40px 20px;color:var(--dim);font-size:15px">No cook history yet.<br>Rate recipes after cooking to build your log!</div>`;
  }

  // Group by recipe for summary
  const recipeSummary = {};
  state.cookHistory.forEach(entry => {
    if (!recipeSummary[entry.recipeId]) {
      recipeSummary[entry.recipeId] = { name: entry.name, count: 0, totalRating: 0, lastDate: entry.date };
    }
    recipeSummary[entry.recipeId].count++;
    recipeSummary[entry.recipeId].totalRating += entry.rating || 0;
    if (entry.date > recipeSummary[entry.recipeId].lastDate) {
      recipeSummary[entry.recipeId].lastDate = entry.date;
    }
  });

  const summaryHtml = Object.values(recipeSummary)
    .sort((a,b) => b.count - a.count)
    .map(r => {
      const avgRating = r.count > 0 ? Math.round(r.totalRating / r.count) : 0;
      const stars = "⭐".repeat(avgRating) + "☆".repeat(5 - avgRating);
      return `
        <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06)">
          <div style="flex:1">
            <div style="font-size:15px;font-weight:600;color:var(--text)">${esc(r.name)}</div>
            <div style="font-size:12px;color:var(--dim);margin-top:2px">Last made: ${r.lastDate}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:12px;color:var(--green);font-weight:700">${r.count}x made</div>
            <div style="font-size:11px;color:var(--amber)">${stars}</div>
          </div>
        </div>`;
    }).join("");

  const recentHtml = state.cookHistory.slice(0, 20).map(entry => {
    const stars = "⭐".repeat(entry.rating || 0);
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
        <div style="flex:1">
          <div style="font-size:14px;color:var(--text)">${esc(entry.name)}</div>
          <div style="font-size:12px;color:var(--dim)">${entry.date}</div>
        </div>
        <div style="font-size:13px;color:var(--amber)">${stars}</div>
      </div>`;
  }).join("");

  return `
    <div style="margin-bottom:16px">
      <div style="font-size:18px;font-weight:700;margin-bottom:4px">📖 Recipe Summary</div>
      <div style="color:var(--dim);font-size:13px">How often you've made each recipe</div>
    </div>
    <div style="background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:20px">
      ${summaryHtml}
    </div>
    <div style="font-size:18px;font-weight:700;margin-bottom:10px">🕐 Recent Cooks</div>
    <div style="background:var(--surface);border-radius:14px;padding:14px 16px">
      ${recentHtml}
    </div>
  `;
}

// ── SUNDAY PREP ORDER ────────────────────────────────────────────────────────
function generatePrepOrder() {
  const activeRecipes = [
    ...state.dinners,
    ...state.breakfasts,
    ...state.lunches,
    ...state.desserts,
  ].filter(r => r && isActive(r.id));

  if (!activeRecipes.length) return "<div style=\"color:var(--dim);font-size:14px;padding:20px;text-align:center\">No active recipes this week.</div>";

  // Categorize by cook type
  const slowCooker = activeRecipes.filter(r => r.name && (r.name.toLowerCase().includes("slow cooker") || (r.prepTime && r.prepTime.toLowerCase().includes("slow cooker"))));
  const batchCook = activeRecipes.filter(r => r.tags && r.tags.includes("prep-ahead") || (r.description && r.description.toLowerCase().includes("batch")));
  const quickAssembly = activeRecipes.filter(r => {
    const mins = parseInt((r.activeTime || "0").replace(/[^0-9]/g,"")) || 0;
    return mins <= 15;
  });
  const standard = activeRecipes.filter(r => !slowCooker.includes(r));

  const totalMins = activeRecipes.reduce((a,r) => a + (parseInt((r.activeTime||"0").replace(/[^0-9]/g,""))||0), 0);

  // Build smart order
  const orderedSteps = [];
  let step = 1;

  // Step 1: Start slow cooker items first (they cook themselves)
  if (slowCooker.length) {
    orderedSteps.push({
      step: step++,
      time: "First — set it and forget it",
      color: "var(--green)",
      icon: "🥘",
      recipes: slowCooker,
      note: "Start these first — they cook unattended while you prep everything else"
    });
  }

  // Step 2: Anything that needs to marinate or brine
  const marinade = activeRecipes.filter(r => r.instructions && r.instructions.some(i => i && (i.toLowerCase().includes("marinat") || i.toLowerCase().includes("dry brine"))));
  if (marinade.length) {
    orderedSteps.push({
      step: step++,
      time: "Next — start marinades",
      color: "var(--indigo)",
      icon: "⏱️",
      recipes: marinade,
      note: "Get these marinating early — flavor improves with time"
    });
  }

  // Step 3: Batch prep (grating, chopping shared veg)
  const sharedVeg = [];
  const needsGrating = activeRecipes.filter(r => r.ingredients && r.ingredients.some(i => i && i.toLowerCase().includes("grate")));
  if (needsGrating.length > 1) {
    sharedVeg.push("Grate all zucchini and carrots at once — shared across " + needsGrating.map(r => r.name).join(", "));
  }
  const needsGarlic = activeRecipes.filter(r => r.ingredients && r.ingredients.some(i => i && i.toLowerCase().includes("garlic")));
  if (needsGarlic.length > 1) {
    sharedVeg.push("Mince all garlic at once — shared across " + needsGarlic.length + " recipes");
  }
  const needsOnion = activeRecipes.filter(r => r.ingredients && r.ingredients.some(i => i && i.toLowerCase().includes("onion")));
  if (needsOnion.length > 1) {
    sharedVeg.push("Dice all onions at once — shared across " + needsOnion.length + " recipes");
  }

  if (sharedVeg.length) {
    orderedSteps.push({
      step: step++,
      time: "Batch prep — one knife session for everything",
      color: "var(--amber)",
      icon: "🔪",
      notes: sharedVeg,
      recipes: [],
    });
  }

  // Step 4: Oven items (roasting, baking)
  const ovenItems = activeRecipes.filter(r => !slowCooker.includes(r) && r.instructions && r.instructions.some(i => i && (i.toLowerCase().includes("oven") || i.toLowerCase().includes("bake") || i.toLowerCase().includes("roast") || i.toLowerCase().includes("375") || i.toLowerCase().includes("425"))));
  if (ovenItems.length) {
    orderedSteps.push({
      step: step++,
      time: "Oven items — start while stovetop cools",
      color: "#f472b6",
      icon: "🔥",
      recipes: ovenItems,
      note: "Preheat oven 15 min before you need it"
    });
  }

  // Step 5: Remaining stovetop items
  const stovetop = activeRecipes.filter(r => !slowCooker.includes(r) && !ovenItems.includes(r) && !marinade.includes(r));
  if (stovetop.length) {
    orderedSteps.push({
      step: step++,
      time: "Stovetop cooking",
      color: "var(--text)",
      icon: "🍳",
      recipes: stovetop,
      note: null
    });
  }

  const stepsHtml = orderedSteps.map(s => {
    const recipesHtml = (s.recipes || []).map(r => `
      <div style="display:flex;align-items:center;gap:8px;padding:5px 0">
        <span style="font-size:16px">${r.emoji||"🍽️"}</span>
        <div>
          <div style="font-size:14px;color:var(--text);font-weight:600">${esc(r.name)}</div>
          <div style="font-size:12px;color:var(--dim)">${r.activeTime||""} active${r.prepTime ? " · " + r.prepTime : ""}</div>
        </div>
      </div>`).join("");
    const notesHtml = (s.notes || []).map(n => `<div style="font-size:13px;color:var(--muted);padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04)">• ${esc(n)}</div>`).join("");
    return `
      <div style="background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px;border-left:3px solid ${s.color}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-size:20px">${s.icon}</span>
          <div>
            <div style="font-size:12px;font-weight:700;color:${s.color};text-transform:uppercase;letter-spacing:1px">Step ${s.step}</div>
            <div style="font-size:15px;font-weight:700;color:var(--text)">${s.time}</div>
          </div>
        </div>
        ${s.note ? `<div style="font-size:13px;color:var(--dim);margin-bottom:8px;font-style:italic">${esc(s.note)}</div>` : ""}
        ${recipesHtml}
        ${notesHtml}
      </div>`;
  }).join("");

  return `
    <div style="background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2);border-radius:12px;padding:12px 16px;margin-bottom:16px">
      <div style="font-size:14px;font-weight:700;color:var(--green);margin-bottom:4px">⏱️ Estimated total active time: ~${totalMins} minutes</div>
      <div style="font-size:13px;color:var(--muted)">Follow this order to minimize total time in the kitchen</div>
    </div>
    ${stepsHtml}
  `;
}

// ── RECIPE SCALING ────────────────────────────────────────────────────────────
function setScale(recipeId, factor) {
  scaleFactors[recipeId] = factor;
  // Re-render the recipe modal if open
  const modal = document.getElementById("recipe-modal");
  if (modal && modal.style.display !== "none") {
    // Find current recipe and re-render
    const titleEl = modal.querySelector(".modal-title");
    if (titleEl) {
      const allRecipes = [...state.dinners, ...state.breakfasts, ...state.lunches, ...state.desserts];
      const recipe = allRecipes.find(r => r.name && titleEl.textContent.includes(r.name.substring(0,15)));
      if (recipe) {
        const section = state.dinners.includes(recipe) ? "dinner" : state.breakfasts.includes(recipe) ? "breakfast" : state.lunches.includes(recipe) ? "lunch" : "dessert";
        viewRecipe(section, recipe.id);
      }
    }
  }
}


// ── 1. SMART GROCERY DEDUPLICATION ──────────────────────────────────────────
function normalizeIngredient(text) {
  if (!text || typeof text !== "string") return null;
  const t = text.toLowerCase().trim();
  // Skip section headers and sauce suggestions
  if (t.startsWith("---") || t.startsWith("🫙") || t.startsWith("//")) return null;
  // Extract the core ingredient name (remove quantities and measurements)
  return t
    .replace(/^[\d½¼¾⅓⅔]+\s*(cup|tbsp|tsp|oz|lb|lbs|g|kg|ml|l|clove|cloves|head|heads|bunch|can|jar|bag|carton|slice|slices|piece|pieces|sprig|sprigs|pinch|dash|handful|packet|strip|strips|fillet|fillets|sheet|pound|ounce|tablespoon|teaspoon)s?\s*(of\s+)?/gi, "")
    .replace(/\([^)]*\)/g, "") // remove parenthetical notes
    .replace(/,.*$/, "") // remove everything after comma
    .replace(/\s+/g, " ")
    .trim();
}

function getIngredientKey(text) {
  const n = normalizeIngredient(text);
  if (!n) return null;
  // Map to canonical ingredient names
  const mappings = [
    [/garlic/, "garlic"],
    [/zucchini/, "zucchini"],
    [/carrot/, "carrots"],
    [/onion/, "onion"],
    [/avocado oil|refined avocado/, "avocado oil"],
    [/olive oil/, "olive oil"],
    [/ground turkey|jennie-o/, "ground turkey (Jennie-O 93/7)"],
    [/chicken thigh/, "boneless skinless chicken thighs"],
    [/fairlife.*milk|milk.*fairlife/, "Fairlife 2% milk"],
    [/fage.*yogurt|greek yogurt/, "Fage 0% Greek yogurt"],
    [/baby spinach|spinach/, "baby spinach"],
    [/cherry tomato/, "cherry tomatoes"],
    [/lemon/, "lemon"],
    [/lime/, "lime"],
    [/salt/, "kosher salt"],
    [/black pepper|pepper/, "black pepper"],
  ];
  for (const [re, canonical] of mappings) {
    if (re.test(n)) return canonical;
  }
  return n.substring(0, 40); // use first 40 chars as key
}

function buildDeduplicatedGroceryList(recipes) {
  // Map: ingredientKey -> { text, sources[], count }
  const deduped = {};
  recipes.forEach(recipe => {
    (recipe.ingredients || []).forEach(ing => {
      const text = typeof ing === "string" ? ing : (ing.text || "");
      const key = getIngredientKey(text);
      if (!key) return;
      if (!deduped[key]) {
        deduped[key] = { text, sources: [], count: 0, key };
      }
      deduped[key].count++;
      if (!deduped[key].sources.includes(recipe.name)) {
        deduped[key].sources.push(recipe.name);
      }
    });
  });
  return Object.values(deduped);
}

function filterBySearch(recipes) {
  if (!searchQuery.trim()) return recipes;
  const q = searchQuery.toLowerCase();
  return recipes.filter(r =>
    (r.name && r.name.toLowerCase().includes(q)) ||
    (r.description && r.description.toLowerCase().includes(q)) ||
    (r.ingredients && r.ingredients.some(i => i && i.toLowerCase && i.toLowerCase().includes(q))) ||
    (r.tips && r.tips.toLowerCase().includes(q))
  );
}

// ── 3. MULTI-TIMER IN COOK MODE ──────────────────────────────────────────────
const multiTimers = {}; // id -> { label, seconds, remaining, running, interval }

function addMultiTimer(label, seconds) {
  const id = "t" + Date.now();
  multiTimers[id] = { id, label, seconds, remaining: seconds, running: false, interval: null };
  renderMultiTimerPanel();
  return id;
}

function toggleMultiTimer(id) {
  const t = multiTimers[id];
  if (!t) return;
  if (t.running) {
    clearInterval(t.interval);
    t.running = false;
  } else {
    t.running = true;
    t.interval = setInterval(() => {
      t.remaining--;
      if (t.remaining <= 0) {
        clearInterval(t.interval);
        t.running = false;
        t.remaining = 0;
        // Vibrate if supported
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        // Audio beep
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          osc.connect(ctx.destination);
          osc.frequency.value = 880;
          osc.start();
          setTimeout(() => { osc.stop(); ctx.close(); }, 600);
        } catch(e) {}
      }
      renderMultiTimerPanel();
    }, 1000);
  }
  renderMultiTimerPanel();
}

function resetMultiTimer(id) {
  const t = multiTimers[id];
  if (!t) return;
  clearInterval(t.interval);
  t.running = false;
  t.remaining = t.seconds;
  renderMultiTimerPanel();
}

function removeMultiTimer(id) {
  if (multiTimers[id]) {
    clearInterval(multiTimers[id].interval);
    delete multiTimers[id];
  }
  renderMultiTimerPanel();
}

function fmtTimer(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ":" + String(sec).padStart(2, "0");
}

function renderMultiTimerPanel() {
  const panel = document.getElementById("multi-timer-panel");
  if (!panel) return;
  const timers = Object.values(multiTimers);
  if (!timers.length) {
    panel.innerHTML = `<div style="color:var(--dim);font-size:13px;text-align:center;padding:8px">No active timers — tap ⏱️ on any step to start one</div>`;
    return;
  }
  panel.innerHTML = timers.map(t => {
    const pct = t.seconds > 0 ? (t.remaining / t.seconds) * 100 : 0;
    const color = t.remaining <= 60 ? "#ef4444" : t.remaining <= 180 ? "var(--amber)" : "var(--green)";
    return `
      <div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.08)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div style="font-size:13px;color:var(--muted);flex:1">${esc(t.label)}</div>
          <div style="font-size:20px;font-weight:700;color:${color};margin:0 8px">${fmtTimer(t.remaining)}</div>
          <div style="display:flex;gap:4px">
            <button onclick="toggleMultiTimer('${t.id}')" style="padding:4px 10px;border-radius:8px;border:none;background:${t.running ? "var(--amber)" : "var(--green)"};color:#0a0f1a;font-size:12px;font-weight:700;cursor:pointer">${t.running ? "⏸" : "▶"}</button>
            <button onclick="resetMultiTimer('${t.id}')" style="padding:4px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:var(--dim);font-size:12px;cursor:pointer">↺</button>
            <button onclick="removeMultiTimer('${t.id}')" style="padding:4px 8px;border-radius:8px;border:1px solid rgba(239,68,68,0.3);background:transparent;color:#ef4444;font-size:12px;cursor:pointer">✕</button>
          </div>
        </div>
        <div style="height:4px;background:rgba(255,255,255,0.08);border-radius:2px">
          <div style="height:4px;border-radius:2px;background:${color};width:${pct}%;transition:width 1s linear"></div>
        </div>
      </div>`;
  }).join("");
}

function addTimerFromStep(label, seconds) {
  addMultiTimer(label, seconds);
  // Show panel if hidden
  const panel = document.getElementById("multi-timer-panel");
  const container = document.getElementById("multi-timer-container");
  if (container) container.style.display = "block";
}

// ── 4. PULL TO REFRESH ───────────────────────────────────────────────────────
let pullStartY = 0;
let isPulling = false;

function initPullToRefresh() {
  const el = document.querySelector(".page.active") || document.body;
  document.addEventListener("touchstart", (e) => {
    pullStartY = e.touches[0].clientY;
    isPulling = window.scrollY === 0;
  }, { passive: true });

  document.addEventListener("touchmove", (e) => {
    if (!isPulling) return;
    const pullDist = e.touches[0].clientY - pullStartY;
    const indicator = document.getElementById("pull-indicator");
    if (pullDist > 20 && indicator) {
      indicator.style.opacity = Math.min(pullDist / 80, 1);
      indicator.style.transform = `translateY(${Math.min(pullDist * 0.4, 30)}px)`;
    }
  }, { passive: true });

  document.addEventListener("touchend", async (e) => {
    const pullDist = e.changedTouches[0].clientY - pullStartY;
    const indicator = document.getElementById("pull-indicator");
    if (indicator) { indicator.style.opacity = 0; indicator.style.transform = ""; }
    if (isPulling && pullDist > 70) {
      // Trigger sync
      if (state.supabaseUrl && state.supabaseKey) {
        const indicator2 = document.getElementById("pull-indicator");
        if (indicator2) { indicator2.textContent = "🔄 Syncing..."; indicator2.style.opacity = 1; }
        await loadFromSupabase();
        renderTab(currentTab);
        if (indicator2) {
          indicator2.textContent = "✅ Synced!";
          setTimeout(() => { indicator2.style.opacity = 0; }, 1500);
        }
      }
    }
    isPulling = false;
  });
}

// ── 5. SWIPE GESTURES ────────────────────────────────────────────────────────
function initSwipeGestures() {
  let startX = 0;
  let startY = 0;
  let targetCard = null;

  document.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    targetCard = e.target.closest(".card, .dinner-card");
  }, { passive: true });

  document.addEventListener("touchend", (e) => {
    if (!targetCard) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 0.8) return; // not a horizontal swipe

    // Get recipe id from card
    const btn = targetCard.querySelector("[onclick*='toggleRecipeActive']");
    if (!btn) return;
    const match = btn.getAttribute("onclick").match(/toggleRecipeActive\('([^']+)'/);
    if (!match) return;
    const id = match[1];

    if (dx > 60) {
      // Swipe right = toggle On/Off
      state.activeRecipes[id] = !isActive(id);
      scheduleSave();
      renderTab(currentTab);
      if (navigator.vibrate) navigator.vibrate(50);
    } else if (dx < -60) {
      // Swipe left = show delete confirm
      if (confirm("Remove this recipe?")) {
        state.dinners = state.dinners.filter(r => r.id !== id);
        state.breakfasts = state.breakfasts.filter(r => r.id !== id);
        state.lunches = state.lunches.filter(r => r.id !== id);
        state.desserts = state.desserts.filter(r => r.id !== id);
        scheduleSave();
        renderTab(currentTab);
        if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
      }
    }
    targetCard = null;
  });
}


function refreshToLatestRecipes() {
  if (!confirm("This will add all new recipes to your library while keeping your existing data. Continue?")) return;
  
  const safeArr = (arr) => (arr || []).filter(r => r && r.id);
  
  // Get current IDs
  const loadedDinnerIds = safeArr(state.dinners).map(r => r.id);
  const loadedBreakfastIds = safeArr(state.breakfasts).map(r => r.id);
  const loadedLunchIds = safeArr(state.lunches).map(r => r.id);
  const loadedDessertIds = safeArr(state.desserts).map(r => r.id);

  // Add any missing defaults
  const missingDinners = safeArr(DEFAULT_DINNERS).filter(r => !loadedDinnerIds.includes(r.id));
  const missingBreakfasts = safeArr(DEFAULT_BREAKFASTS).filter(r => !loadedBreakfastIds.includes(r.id));
  const missingLunches = safeArr(DEFAULT_LUNCHES).filter(r => !loadedLunchIds.includes(r.id));
  const dessertDefs = safeArr(typeof DEFAULT_DESSERT !== "undefined" ? DEFAULT_DESSERT : []);
  const missingDesserts = dessertDefs.filter(r => !loadedDessertIds.includes(r.id));

  // Update existing recipes with latest instructions/tips
  state.dinners = safeArr(state.dinners).map(r => {
    const def = safeArr(DEFAULT_DINNERS).find(d => d.id === r.id);
    if (!def) return r;
    return {...def, ...r, 
      instructions: (r.instructions && r.instructions.length > 2) ? r.instructions : def.instructions,
      tips: r.tips && r.tips.length > 20 ? r.tips : (def.tips || ""),
      ingredients: (r.ingredients && r.ingredients.length > 2) ? r.ingredients : def.ingredients,
    };
  });

  let added = 0;
  if (missingDinners.length)    { state.dinners    = [...state.dinners, ...missingDinners];       added += missingDinners.length; }
  if (missingBreakfasts.length) { state.breakfasts = [...state.breakfasts, ...missingBreakfasts]; added += missingBreakfasts.length; }
  if (missingLunches.length)    { state.lunches    = [...state.lunches, ...missingLunches];       added += missingLunches.length; }
  if (missingDesserts.length)   { state.desserts   = [...state.desserts, ...missingDesserts];     added += missingDesserts.length; }

  scheduleSave();
  renderTab("plan");
  renderSettings();
  
  alert("✅ Done! Added " + added + " new recipes and updated existing ones with latest instructions and tips.");
}

function handleAtlantaSearch(query) {
  atlantaQuery = query;
  if (!query) {
    atlantaResults = "";
    atlantaLoading = false;
    renderEatOut();
  }
}

async function searchAtlanta(query) {
  if (!query || query.trim().length < 2) return;
  if (!state.anthropicKey) {
    atlantaResults = `<div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--amber)">
      ⚠️ Add your Anthropic API key in ⚙️ Settings to use the restaurant search.<br><br>
      <span style="font-size:12px;color:var(--dim)">Get a free key at console.anthropic.com — paste it in Settings → Anthropic API Key</span>
    </div>`;
    renderEatOut();
    return;
  }
  atlantaLoading = true;
  atlantaResults = "";
  renderEatOut();

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { 
        "Content-Type": "application/json",
        "x-api-key": state.anthropicKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: `You are a nutrition expert helping a family in Atlanta find high-protein, lower-calorie options when ordering from restaurants or chains on DoorDash.
The user is a 44-year-old radiologist who prioritizes: high protein (40g+ per meal ideally), lower calorie, family-friendly options.
For any restaurant or cuisine type, give 2-3 specific dish recommendations with protein and calories estimates and specific ordering hacks.
Format as clean HTML with inline styles only. Use these exact color values in inline styles: green=#10b981, amber=#f59e0b, text=#f1f5f9, dim=#94a3b8, background=rgba(255,255,255,0.05). 
Keep it concise and mobile-friendly. No markdown. No CSS classes. No CSS variables. Return only HTML, no preamble, no backticks.`,
        messages: [{ role: "user", content: `Find the best high-protein, lower-calorie options at: ${query}. If it's a local Atlanta restaurant, give specific dish recommendations. If it's a chain, give specific ordering hacks beyond the obvious.` }]
      })
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      throw new Error("API error " + response.status + ": " + (errData.error && errData.error.message || response.statusText));
    }
    const data = await response.json();
    console.log("Atlanta search response:", data);
    const text = data.content && data.content[0] && data.content[0].text ? data.content[0].text : "";
    console.log("Result text length:", text.length);
    
    atlantaResults = text || `<div style="color:var(--dim);text-align:center;padding:20px">No results found. Try a different restaurant or cuisine.</div>`;
    atlantaLoading = false;
    renderEatOut();

    // Re-focus search input
    setTimeout(() => {
      const inp = document.getElementById("atlanta-search");
      if (inp) { inp.value = atlantaQuery; }
    }, 100);

  } catch(e) {
    atlantaLoading = false;
    atlantaResults = `<div style="color:#ef4444;padding:14px;background:rgba(239,68,68,0.08);border-radius:12px;font-size:13px">Error: ${e.message}. Check your API key in Settings and try again.</div>`;
    console.error("Atlanta search error:", e);
    renderEatOut();
  }
}

            </div>
          </div>
          <div style="font-size:12px;color:var(--muted)">${esc(d.note)}</div>

      const hackAvoidHtml = isExpanded ? `
        <div style="background:rgba(16,185,129,0.06);border-radius:10px;padding:10px 12px;margin-bottom:6px;border:1px solid rgba(16,185,129,0.15)">
          <div style="font-size:11px;font-weight:700;color:var(--green);margin-bottom:4px">💡 THE HACK</div>

          <div style="font-size:11px;font-weight:700;color:#ef4444;margin-bottom:4px">⚠️ AVOID</div>
          <div style="font-size:13px;color:var(--muted)">${esc(r.avoid)}</div>
        </div>` : "";

      return `

function renderPantry() {
  const el = document.getElementById("page-pantry");
  const allItems = PANTRY_SECTIONS.flatMap(s => s.items);
  const haveCount = allItems.filter(i => state.pantry[i.id] === "have").length;
  const lowCount  = allItems.filter(i => state.pantry[i.id] === "low").length;
  const outCount  = allItems.filter(i => !state.pantry[i.id]).length;
  const needToBuy = allItems.filter(i => state.pantry[i.id] !== "have");

  // Single clean list — one row per item, tap to cycle status
  const sectionsHtml = PANTRY_SECTIONS.map(({section, items}) => {
    const rows = items.map(item => {
      const status = state.pantry[item.id] || "";
      const statusLabel = status === "have" ? "✓ Have" : status === "low" ? "⚠ Low" : "✕ Out";
      const statusColor = status === "have" ? "var(--green)" : status === "low" ? "var(--amber)" : "#ef4444";
      const statusBg    = status === "have" ? "rgba(16,185,129,0.1)" : status === "low" ? "rgba(245,158,11,0.1)" : "rgba(239,68,68,0.08)";
      const borderColor = status === "have" ? "rgba(16,185,129,0.3)" : status === "low" ? "rgba(245,158,11,0.3)" : "rgba(239,68,68,0.15)";
      return `
        <div onclick="cyclePantry('${item.id}')" style="display:flex;align-items:center;gap:14px;padding:14px 16px;background:${statusBg};border:1.5px solid ${borderColor};border-radius:14px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;">
          <div style="flex:1;min-width:0">
            <div style="font-size:16px;font-weight:600;color:var(--text)">${esc(item.name)}</div>
            <div style="font-size:13px;color:var(--dim);margin-top:2px">${esc(item.sub)}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0">
            <div style="font-size:15px;font-weight:700;color:${statusColor};padding:6px 14px;background:${statusBg};border:1.5px solid ${borderColor};border-radius:20px;white-space:nowrap">${statusLabel}</div>
            <div style="font-size:11px;color:var(--dim)">tap to change</div>
          </div>
        </div>`;
    }).join("");
    return `
      <div style="margin-bottom:20px">
        <div style="font-size:13px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-left:4px">${section}</div>
        ${rows}
      </div>`;
  }).join("");

  el.innerHTML = `
    <div style="margin-bottom:16px">
      <div style="font-size:20px;font-weight:700;margin-bottom:4px">🧄 Pantry Tracker</div>
      <div style="color:var(--dim);font-size:14px">Tap any item to cycle: Out → Have → Low</div>

    <div class="stats-row" style="margin-bottom:16px">

      <div class="stat-box"><div class="stat-icon">❌</div><div class="stat-val">${outCount}</div><div class="stat-label">out</div></div>
      <div class="stat-box" onclick="showTab('grocery')" style="cursor:pointer"><div class="stat-icon">🛒</div><div class="stat-val">${needToBuy.length}</div><div class="stat-label">to buy</div></div>
    </div>

    ${needToBuy.length ? `
      <button onclick="addPantryToGrocery()" style="width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--green),#059669);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:18px">

      </button>` : `

function enrichStepWithAmounts(stepText, ingredients) {
  // Build a map of ingredient name -> amount from the ingredients list
  if (!ingredients || !ingredients.length) return stepText;
  let enriched = stepText;
  ingredients.forEach(ing => {
    if (!ing || ing.startsWith("---") || ing.startsWith("🫙")) return;
    // Parse amount and ingredient name from strings like "1 large onion, diced"
    const match = ing.match(/^([\d\/\s½¼¾⅓⅔⅛⅜⅝⅞.]+(?:cup|cups|tbsp|tsp|oz|lb|lbs|g|kg|ml|l|cloves?|clove|large|medium|small|can|cans|slice|slices|bunch|head|heads|stalks?|inch|inches|pkg|package|lb|pound|pounds|strip|strips|piece|pieces|handful|pinch|dash|sprig|sprigs|sheet|sheets)?[\s]?(?:\([^)]+\))?\s+)/i);
    if (!match) return;
    const amount = match[1].trim();
    // Get just the ingredient name (before comma)
    const rest = ing.slice(match[0].length);
    const namePart = rest.split(/[,—–]/)[0].trim().toLowerCase();
    if (!namePart || namePart.length < 3) return;
    // Try to find this ingredient name in the step text and prepend the amount
    const nameWords = namePart.split(" ").filter(w => w.length > 3);
    nameWords.forEach(word => {
      const regex = new RegExp("(?<![0-9\/½¼¾]\s?)\b" + word + "\b", "gi");
      if (regex.test(enriched)) {
        // Only add amount if not already present
        enriched = enriched.replace(new RegExp("(dice|mince|chop|slice|add|cook|combine|stir|mix|whisk|sear|brown|heat|pour|fold|add|place|put)\s+(" + word + ")", "gi"),
          (match, verb, noun) => `${verb} ${amount} ${noun}`);
      }
    });
  });
  return enriched;
}

  } else if(mode==="ingredients") {

      if(ing.startsWith("---"))return`<div class="cook-ingr-section">${esc(ing.replace(/---/g,"").trim())}</div>`;
      const checked=cookState.checkedIngr[i]?"checked":"";

      if(allSteps[i].startsWith("──")){

    let timerHtml="";

function formatTimer(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h>0?h+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0"):String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");}

function toggleTimer(){
  const t=cookState.timer;
  if(t.running){clearInterval(t.interval);t.running=false;}
  else{
    if(t.seconds<=0)return; t.running=true;
    t.interval=setInterval(()=>{
      t.seconds--;
      const el=document.getElementById("cook-timer-display");
      if(el){el.textContent=formatTimer(t.seconds);el.className="cook-timer-display "+(t.seconds>0?"running":"done");}
      if(t.seconds<=0){
        clearInterval(t.interval);t.running=false;
        try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,300,600].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.setValueAtTime(0.3,ctx.currentTime+d/1000);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d/1000+0.3);o.start(ctx.currentTime+d/1000);o.stop(ctx.currentTime+d/1000+0.3);});}catch(e){}
      }
    },1000);
  }
  renderCookScreen();
}

function resetTimer(secs){clearInterval(cookState.timer.interval);cookState.timer={seconds:secs,_original:secs,running:false,interval:null};renderCookScreen();}
function cookNext(){clearInterval(cookState.timer.interval);cookState.timer={seconds:0,running:false,interval:null,_original:0};cookState.step=Math.min(cookState.step+1,cookState.recipe.instructions.length);renderCookScreen();}
function cookPrev(){clearInterval(cookState.timer.interval);cookState.timer={seconds:0,running:false,interval:null,_original:0};cookState.step=Math.max(cookState.step-1,0);renderCookScreen();}
function setCookMode(mode){cookState.mode=mode;renderCookScreen();}
function toggleCookIngr(i,el){cookState.checkedIngr[i]=!cookState.checkedIngr[i];el.classList.toggle("checked",cookState.checkedIngr[i]);el.querySelector(".cook-ingr-check").textContent=cookState.checkedIngr[i]?"✓":"";}
function exitCook(){clearInterval(cookState.timer.interval);cookState={recipe:null,step:0,mode:"steps",checkedIngr:{},timer:{seconds:0,running:false,interval:null,_original:0}};renderCookHome();}

async function exportToPaprika() {
  // Build grocery list from week plan assignments only
  const weekPlanRecipes = Object.values(state.weekPlan || {})
    .filter(assignment => assignment && assignment.recipeId)
    .map(assignment => {
      const allR = [...state.dinners, ...state.breakfasts, ...state.lunches, ...state.desserts];
      return allR.find(r => r && r.id === assignment.recipeId);
    })
    .filter((r, idx, arr) => r != null && arr.findIndex(x => x && x.id === r.id) === idx); // deduplicate

  // Fall back to activeRecipes if weekPlan is empty
  const allRecipes = weekPlanRecipes.length > 0 ? weekPlanRecipes : [
    ...state.dinners,
    ...state.breakfasts,
    ...state.lunches,
    ...state.desserts,
  ].filter(r => r && isActive(r.id));
  const paprikaRecipes = allRecipes.map(r => {
    const ingredients = (r.ingredients || [])
      .filter(i => !i.startsWith("---"))
      .join("\n");
    const directions = (r.instructions || [])
      .map((s, i) => (i+1) + ". " + s)
      .join("\n\n");
    const notes = [
      r.tips ? "💡 " + r.tips : "",
      r.hiddenVeg ? "🥦 Hidden veg: " + r.hiddenVeg : "",
      r.leftoverNote ? "♻️ " + r.leftoverNote : "",
      r.source ? "Source: " + r.source : "",
    ].filter(Boolean).join("\n\n");

    return {
      uid:          r.id || uid(),
      name:         r.name || "Untitled",
      ingredients:  ingredients,
      directions:   directions,
      notes:        notes,
      description:  r.description || "",
      source:       r.source || "Lemmon Family Meal Planner",
      source_url:   r.sourceUrl || "",
      prep_time:    r.activeTime || "",
      cook_time:    r.totalTime || "",
      servings:     r.serves || "4",
      nutritional_info: [
        r.calories ? "Calories: " + r.calories : "",
        r.protein  ? "Protein: "  + r.protein + "g" : "",
      ].filter(Boolean).join(" | "),
      categories:   r.kidFriendly ? ["Family","Kid-Friendly"] : ["Family"],
      photo_hash:   null,
      photo:        null,
      rating:       0,
      difficulty:   "",
      on_favorites: false,
      in_trash:     false,
      scale:        null,
      hash:         uid(),
      created:      new Date().toISOString(),
    };
  });
  try {
    const { default: JSZip } = await import("https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm");

    const zip = new JSZip();

    for (const recipe of paprikaRecipes) {
      const json = JSON.stringify(recipe);
      const filename = recipe.name.replace(/[^a-zA-Z0-9 ]/g, "").trim() + ".paprikarecipe";
      zip.file(filename, json, { compression: "DEFLATE", compressionOptions: { level: 6 } });
    }

    const blob = await zip.generateAsync({ type: "blob", mimeType: "application/zip" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "LemmonFamilyRecipes.paprikarecipes";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showExportStatus("✅ Downloaded! Open Paprika 3 → Settings → Import → select the file.");
  } catch(e) {
    console.error("Export error:", e);
    showExportStatus("⚠️ Export failed: " + e.message);
  }
}

function showExportStatus(msg) {
  const el = document.getElementById("paprika-status");
  if (el) { el.textContent = msg; el.style.display = "block"; }
}

async function importFromPaprika(file) {
  if (!file) return;
  showImportStatus("Reading file...");

  try {
    const { default: JSZip } = await import("https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm");
    const zip = await JSZip.loadAsync(file);
    const imported = { dinners:[], breakfasts:[], lunches:[], skipped:0 };

    for (const [filename, zipEntry] of Object.entries(zip.files)) {
      if (zipEntry.dir) continue;
      try {
        let jsonStr;
        try {
          jsonStr = await zipEntry.async("string");
          if (jsonStr.charCodeAt(0) === 31 && jsonStr.charCodeAt(1) === 139) {
            throw new Error("binary");
          }
        } catch(e) {
          const bytes = await zipEntry.async("uint8array");
          const ds = new DecompressionStream("gzip");
          const writer = ds.writable.getWriter();
          const reader = ds.readable.getReader();
          writer.write(bytes);
          writer.close();
          const chunks = [];
          let done = false;
          while (!done) {
            const { value, done: d } = await reader.read();
            if (value) chunks.push(value);
            done = d;
          }
          const totalLen = chunks.reduce((a, c) => a + c.length, 0);
          const merged = new Uint8Array(totalLen);
          let offset = 0;
          for (const c of chunks) { merged.set(c, offset); offset += c.length; }
          jsonStr = new TextDecoder().decode(merged);
        }

        const r = JSON.parse(jsonStr);
        if (!r.name || !r.directions) { imported.skipped++; continue; }
        const ingredients = (r.ingredients || "")
          .split("\n")
          .map(s => s.trim())
          .filter(Boolean);

        const instructions = (r.directions || "")
          .split("\n")
          .map(s => s.trim())
          .filter(Boolean)
          .map(s => s.replace(/^\d+[.)\s]+/, "").trim())
          .filter(Boolean);
        const notes = r.notes || "";
        const tips = (notes.match(/💡 (.+?)(?:\n|$)/)||[])[1] || "";
        const hiddenVeg = (notes.match(/🥦 Hidden veg: (.+?)(?:\n|$)/)||[])[1] || "";
        const leftoverNote = (notes.match(/♻️ (.+?)(?:\n|$)/)||[])[1] || "";

        const recipe = {
          id: r.uid || uid(),
          name: r.name,
          emoji: guessEmoji(r.name, r.categories || []),
          description: r.description || "",
          calories: parseNutri(r.nutritional_info, "Calories"),
          protein: parseNutri(r.nutritional_info, "Protein"),
          activeTime: r.prep_time || "",
          totalTime: r.cook_time || "",
          serves: r.servings || "4 servings",
          kidFriendly: (r.categories || []).some(c => c.toLowerCase().includes("kid")),
          source: r.source || "Paprika",
          sourceUrl: r.source_url || "",
          tips,
          hiddenVeg,
          leftoverNote,
          ingredients: applySwaps(ingredients),
          instructions,
        };
        const cats = (r.categories || []).map(c => c.toLowerCase());
        if (cats.some(c => c.includes("breakfast"))) imported.breakfasts.push(recipe);
        else if (cats.some(c => c.includes("lunch") || c.includes("salad") || c.includes("sandwich"))) imported.lunches.push(recipe);
        else imported.dinners.push(recipe);

      } catch(e) { imported.skipped++; }
    }

    const total = imported.dinners.length + imported.breakfasts.length + imported.lunches.length;
    if (total === 0) {
      showImportStatus("⚠️ No recipes found in file. Make sure you exported as Paprika Recipe Format (.paprikarecipes).");
      return;
    }
    showImportPreview(imported, total);

  } catch(e) {
    console.error("Import error:", e);
    showImportStatus("⚠️ Could not read file: " + e.message);
  }
}

function parseNutri(nutri, field) {
  if (!nutri) return 0;
  const match = nutri.match(new RegExp(field + ":\\s*(\\d+)"));
  return match ? parseInt(match[1]) : 0;
}

function guessEmoji(name, categories) {
  const n = (name || "").toLowerCase();
  const emojis = [
    [/chicken|poultry|turkey(?! bacon)/,"🍗"],[/salmon|fish|cod|tuna|seafood|shrimp|prawn/,"🐟"],
    [/beef|steak|burger/,"🥩"],[/pork|tenderloin/,"🍖"],[/pasta|spaghetti|bolognese|lasagna/,"🍝"],
    [/taco|burrito|mexican/,"🌮"],[/soup|stew|chili/,"🍲"],[/salad/,"🥗"],
    [/pizza/,"🍕"],[/egg|frittata|omelette|scramble/,"🥚"],[/pancake|waffle/,"🥞"],
    [/smoothie/,"🥤"],[/oat|overnight/,"🫙"],[/wrap|lettuce/,"🥬"],
    [/meatball/,"🍝"],[/bowl/,"🥙"],[/sandwich/,"🥪"],
  ];
  for (const [re, emoji] of emojis) { if (re.test(n)) return emoji; }
  return "🍽️";
}

function showImportPreview(imported, total) {
  window._pendingPaprikaImport = imported;
  const rows = [
    imported.dinners.length ? `<div style="padding:8px 0;border-bottom:1px solid var(--border)"><span style="color:var(--green);font-weight:700">🍽️ Dinners (${imported.dinners.length})</span><div style="color:var(--muted);font-size:12px;margin-top:4px">${imported.dinners.slice(0,3).map(r=>r.name).join(", ")}${imported.dinners.length>3?" +more":""}</div></div>` : "",
    imported.lunches.length ? `<div style="padding:8px 0;border-bottom:1px solid var(--border)"><span style="color:var(--green);font-weight:700">🥗 Lunches (${imported.lunches.length})</span><div style="color:var(--muted);font-size:12px;margin-top:4px">${imported.lunches.slice(0,3).map(r=>r.name).join(", ")}${imported.lunches.length>3?" +more":""}</div></div>` : "",
    imported.breakfasts.length ? `<div style="padding:8px 0"><span style="color:var(--green);font-weight:700">⚡ Breakfasts (${imported.breakfasts.length})</span><div style="color:var(--muted);font-size:12px;margin-top:4px">${imported.breakfasts.slice(0,3).map(r=>r.name).join(", ")}${imported.breakfasts.length>3?" +more":""}</div></div>` : "",
  ].filter(Boolean).join("");

  const swapCount = [...imported.dinners,...imported.lunches,...imported.breakfasts]
    .filter(r => r.ingredients.some(i => i.includes("Mission Carb") || i.includes("Brami") || i.includes("0% Greek") || i.includes("reduced-fat") || i.includes("Fairlife"))).length;

  openModal(`
    <div class="modal-header">
      <div class="modal-title">🥘 Import from Paprika</div>
      <button class="modal-close" onclick="closeModalForce()">✕</button>
    </div>
    <div style="background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-size:15px;font-weight:700;color:var(--green);margin-bottom:4px">✅ Found ${total} recipe${total>1?"s":""}</div>
      ${imported.skipped ? `<div style="font-size:12px;color:var(--dim)">${imported.skipped} entries skipped (missing ingredients or steps)</div>` : ""}
    </div>
    ${rows}
    ${swapCount>0 ? `<div style="background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.15);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13px;color:var(--muted)">✅ Your swap library will be applied to ${swapCount} recipe${swapCount>1?"s":""} automatically.</div>` : ""}
    <div style="font-size:12px;color:var(--dim);margin:12px 0">These will be <strong style="color:var(--text)">added</strong> to your existing recipes — nothing will be replaced.</div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn-secondary" onclick="closeModalForce()">Cancel</button>
      <button style="flex:2;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#ff6b35,#f7421e);color:#fff;font-weight:700;font-size:14px;cursor:pointer" onclick="confirmPaprikaImport()">🥘 Import All Recipes</button>
    </div>
  `);
}

function confirmPaprikaImport() {
  const imported = window._pendingPaprikaImport;
  if (!imported) return;
  state.dinners    = [...state.dinners,    ...imported.dinners];
  state.lunches    = [...state.lunches,    ...imported.lunches];
  state.breakfasts = [...state.breakfasts, ...imported.breakfasts];
  window._pendingPaprikaImport = null;
  closeModalForce();
  scheduleSave();
  showTab("plan");
  showImportStatus("✅ Imported " + (imported.dinners.length + imported.lunches.length + imported.breakfasts.length) + " recipes from Paprika!");
}

function showImportStatus(msg) {
  const el = document.getElementById("paprika-import-status");
  if (el) { el.textContent = msg; el.style.display = "block"; }
}


function migrateRecipes() {
  try {
    var safeArr = function(arr) { return (arr || []).filter(function(r) { return r != null && r.id != null; }); };
    var loadedDinnerIds = safeArr(state.dinners).map(function(r){return r.id;});
    var loadedBreakfastIds = safeArr(state.breakfasts).map(function(r){return r.id;});
    var loadedLunchIds = safeArr(state.lunches).map(function(r){return r.id;});
    var loadedDessertIds = safeArr(state.desserts).map(function(r){return r.id;});
    var dessertDefs = safeArr(typeof DEFAULT_DESSERT !== "undefined" ? DEFAULT_DESSERT : []);
    var missingDinners = safeArr(DEFAULT_DINNERS).filter(function(r){return loadedDinnerIds.indexOf(r.id)<0;});
    var missingBreakfasts = safeArr(DEFAULT_BREAKFASTS).filter(function(r){return loadedBreakfastIds.indexOf(r.id)<0;});
    var missingLunches = safeArr(DEFAULT_LUNCHES).filter(function(r){return loadedLunchIds.indexOf(r.id)<0;});
    var missingDesserts = dessertDefs.filter(function(r){return loadedDessertIds.indexOf(r.id)<0;});
    var migrated = 0;
    if (missingDinners.length)    { state.dinners    = safeArr(state.dinners).concat(missingDinners);       migrated += missingDinners.length; }
    if (missingBreakfasts.length) { state.breakfasts = safeArr(state.breakfasts).concat(missingBreakfasts); migrated += missingBreakfasts.length; }
    if (missingLunches.length)    { state.lunches    = safeArr(state.lunches).concat(missingLunches);       migrated += missingLunches.length; }
    if (missingDesserts.length)   { state.desserts   = safeArr(state.desserts).concat(missingDesserts);     migrated += missingDesserts.length; }
    state.dinners = safeArr(state.dinners).map(function(r){ var def=safeArr(DEFAULT_DINNERS).filter(function(d){return d.id===r.id;})[0]; if(!def)return r; return Object.assign({},r,{instructions:(r.instructions&&r.instructions.length>1)?r.instructions:(def.instructions||[]),tips:r.tips||def.tips||""}); });
    if (migrated > 0) { console.log("Migrated",migrated,"new recipes"); scheduleSave(); }
  } catch(e) { console.error("migrateRecipes error:",e); }
}

async function pingSupabase() {
  try {
    if (!state.supabaseUrl || !state.supabaseKey) return;
    const {createClient} = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm");
    const sb = createClient(state.supabaseUrl, state.supabaseKey);
    await sb.from("meal_plans").select("id").limit(1);
  } catch(e) {}
}

async function init() {
  // Version check - clear old incompatible localStorage data
  try {
    var storedVersion = localStorage.getItem('lemmonPlannerVersion');
    if (storedVersion !== '2.1') {
      localStorage.removeItem('lemmonMealPlan_v1');
      localStorage.setItem('lemmonPlannerVersion', '2.1');
    }
  } catch(e) {}
  loadFromLocal();
  migrateRecipes();
  const safeInit = (arr) => (arr||[]).filter(r => r && r.id).map(r => ({...r, ingredients: applySwaps(r.ingredients||[]), instructions: r.instructions||[], tips: r.tips||""}));
  state.breakfasts = safeInit(state.breakfasts);
  state.lunches    = safeInit(state.lunches);
  state.dinners    = safeInit(state.dinners);
  state.desserts   = safeInit(state.desserts);

  var planEl = document.getElementById("page-plan");
  if (planEl) planEl.innerHTML = '<div style="padding:20px;color:#10b981">Loading...</div>';
  try {
    renderPlan();
  } catch(e) {
    var el2 = document.getElementById("page-plan");
    if (el2) el2.innerHTML = '<div style="padding:20px;color:#ef4444;font-size:14px;background:rgba(239,68,68,0.1);margin:16px;border-radius:12px;border:1px solid rgba(239,68,68,0.3);font-family:monospace"><strong>renderPlan error:</strong><br><br>' + (e.message||e) + '<br><br>' + (e.stack||'').substring(0,400) + '</div>';
  }
  if (state.supabaseUrl && state.supabaseKey) {
    try {
      var ok = await initSupabase();
      if (ok) {
        await loadFromSupabase();
        migrateRecipes();
        renderTab(currentTab);
      } else {
        setSyncStatus("offline");
      }
    } catch(e) {
      console.error("Supabase connection error:", e);
      setSyncStatus("offline");
    }
  } else {
    setSyncStatus("offline");
  }
  checkUrlImport();
}

function checkUrlImport() {
  const hash = window.location.hash; // e.g. #import=https://instagram.com/p/xxx
  if (!hash.startsWith("#import=")) return;
  const url = decodeURIComponent(hash.slice(8));
  if (!url) return;
  history.replaceState(null, "", window.location.pathname);
  setTimeout(() => {
    showImportModal("dinner", "url");
    setTimeout(() => {
      const el = document.getElementById("import-url");
      if (el) { el.value = url; el.focus(); }
    }, 150);
  }, 400);
}
window.addEventListener("hashchange", checkUrlImport);

let chatHistory = [];
let chatLoading = false;

function openChatAssistant(contextRecipe) {
  const modal = document.getElementById("chat-assistant-modal");
  if (!modal) return;
  // Set context if viewing a recipe
  if (contextRecipe) {
    window.chatContext = contextRecipe;
  }
  modal.style.display = "flex";
  setTimeout(() => {
    const inp = document.getElementById("chat-input");
    if (inp) inp.focus();
  }, 200);
}

function closeChatAssistant() {
  const modal = document.getElementById("chat-assistant-modal");
  if (modal) modal.style.display = "none";
}

function clearChat() {
  chatHistory = [];
  renderChatMessages();
}

function renderChatMessages() {
  const container = document.getElementById("chat-messages");
  if (!container) return;

  if (!chatHistory.length) {
    container.innerHTML = `
      <div style="text-align:center;padding:30px 20px;color:var(--dim)">
        <div style="font-size:32px;margin-bottom:10px">👨‍🍳</div>
        <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px">Recipe Assistant</div>
        <div style="font-size:13px">Ask anything about cooking, substitutions, technique, macros, or any recipe in your vault.</div>
        <div style="margin-top:14px;display:flex;flex-direction:column;gap:6px">
          ${["Can I use oat flour instead of blending oats?","What temp should I cook chicken thighs to?","How do I fix a sauce that's too salty?","What can I substitute for buttermilk?"].map(q =>
            `<button onclick="sendSuggestedQuestion('${q}')" style="padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:var(--muted);font-size:13px;cursor:pointer;text-align:left">${q}</button>`
          ).join("")}
        </div>
      </div>`;
    return;
  }

  container.innerHTML = chatHistory.map(msg => `
    <div style="display:flex;flex-direction:${msg.role==="user"?"row-reverse":"row"};gap:8px;margin-bottom:12px;align-items:flex-start">
      <div style="font-size:20px;flex-shrink:0">${msg.role==="user"?"👤":"👨‍🍳"}</div>
      <div style="max-width:85%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;
        background:${msg.role==="user"?"linear-gradient(135deg,var(--green),#059669)":"rgba(255,255,255,0.06)"};
        color:${msg.role==="user"?"#0a0f1a":"var(--text)"};
        border-bottom-${msg.role==="user"?"right":"left"}-radius:4px">
        ${msg.content.replace(/\n/g,"<br>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")}
      </div>
    </div>`).join("") + (chatLoading ? `
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <div style="font-size:20px">👨‍🍳</div>
      <div style="padding:10px 14px;border-radius:14px;background:rgba(255,255,255,0.06)">
        <div style="display:flex;gap:4px">
          ${[0,1,2].map(i => `<div style="width:6px;height:6px;border-radius:50%;background:var(--dim);animation:bounce 1s infinite ${i*0.2}s"></div>`).join("")}
        </div>
      </div>
    </div>` : "");

  container.scrollTop = container.scrollHeight;
}

function sendSuggestedQuestion(q) {
  const inp = document.getElementById("chat-input");
  if (inp) inp.value = q;
  sendChatMessage();
}

async function sendChatMessage() {
  const inp = document.getElementById("chat-input");
  if (!inp) return;
  const message = inp.value.trim();
  if (!message || chatLoading) return;

  if (!state.anthropicKey) {
    alert("Add your Anthropic API key in ⚙️ Settings to use the Recipe Assistant.");
    return;
  }

  inp.value = "";
  chatHistory.push({ role: "user", content: message });
  chatLoading = true;
  renderChatMessages();

  // Build context about current recipe if viewing one
  const recipeContext = window.chatContext ? `The user is currently viewing this recipe: ${JSON.stringify({
    name: window.chatContext.name,
    ingredients: window.chatContext.ingredients,
    instructions: window.chatContext.instructions,
    tips: window.chatContext.tips
  })}. ` : "";

  // Build system prompt
  const systemPrompt = `You are a knowledgeable home cooking assistant for the Lemmon family meal planning app. 
${recipeContext}
The family: Andrew (44, radiologist, avid home cook), MK (39, wife), two daughters (7 and 5).
Goals: high protein, lower calorie, family-friendly meals. 
Key pantry items: Dan-O's Original/Spicy/Sea-Soning, Kinder's The Blend, Greek Freak, Nothing Hidden Ranch, Burlap & Barrel spices, Brami/Kaizen protein pasta, Fairlife milk, Fage 0% Greek yogurt, Good Culture cottage cheese, Rao's marinara, Primal Kitchen sauces.
Be concise, practical, and specific. Answer cooking questions directly. For substitutions, give a clear yes/no then explain. For technique questions, give the exact detail they need. No fluff.`;

  try {
    const messages = chatHistory.map(m => ({ role: m.role, content: m.content }));

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": state.anthropicKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 600,
        system: systemPrompt,
        messages: messages
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error && err.error.message || "API error " + response.status);
    }

    const data = await response.json();
    const reply = data.content && data.content[0] && data.content[0].text ? data.content[0].text : "Sorry, I couldn't get a response. Try again.";

    chatHistory.push({ role: "assistant", content: reply });
  } catch(e) {
    chatHistory.push({ role: "assistant", content: "Error: " + e.message + ". Check your API key in Settings." });
  }

  chatLoading = false;
  renderChatMessages();
}
