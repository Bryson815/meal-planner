<script>

    // Cross-origin error - suppress and continue, don't crash the app
    console.warn("Suppressed cross-origin script error");
    return true; // prevent default handling
  }
  var el = document.getElementById("page-plan");

function applySwaps(ingredients) {
  if (!ingredients || !Array.isArray(ingredients)) return ingredients;
  return ingredients.map(ing => {
    if (ing.startsWith("---")) return ing;
    let result = ing;
    for (const rule of SWAP_RULES) {
      if (rule.match.test(result)) {
        result = typeof rule.replace === "function"
          ? result.replace(rule.match, rule.replace)
          : result.replace(rule.match, rule.replace);
        break;
      }
    }
    return result;
  });
}

function getSwapDiff(original, swapped) {
  const changes = [];
  original.forEach((ing, i) => {
    if (swapped[i] && swapped[i] !== ing) {
      changes.push({ from: ing, to: swapped[i] });
    }
  });
  return changes;
}

async function initSupabase() {
  if (!state.supabaseUrl || !state.supabaseKey) return false;
  try {
    var mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    var createClient = mod.createClient;
    if (!createClient) throw new Error("createClient not found");
    supabase = createClient(state.supabaseUrl, state.supabaseKey);
    return true;
  } catch(e) {
    console.error("Supabase init failed:", e);
    supabase = null;
    return false;
  }
}

async function loadFromSupabase() {
  if (!supabase) return;
  try {
    setSyncStatus("loading");
    const { data, error } = await supabase.from("meal_plan").select("*").eq("id", "family").single();
    if (error) {
      if (error.code === "PGRST116") await saveToSupabase(); // no row yet, create it
      return;
    }
    if (data && data.plan) {
      const plan = data.plan;
      if (plan.breakfasts) state.breakfasts = plan.breakfasts.map(r => ({...r, ingredients: applySwaps(r.ingredients)}));
      if (plan.lunches)    state.lunches    = plan.lunches.map(r => ({...r, ingredients: applySwaps(r.ingredients)}));
      if (plan.dinners)    state.dinners    = plan.dinners.map(r => ({...r, ingredients: applySwaps(r.ingredients)}));
      if (plan.swaps)      state.swaps      = plan.swaps;
      if (plan.spiceBlends) state.spiceBlends = plan.spiceBlends;
      if (plan.userEmail)  state.userEmail  = plan.userEmail;
      if (plan.wifeEmail)  state.wifeEmail  = plan.wifeEmail;
      if (plan.store)      state.store      = plan.store;
      if (plan.grocery)    state.grocery    = plan.grocery;
        if (plan.useStaticGrocery !== undefined) state.useStaticGrocery = plan.useStaticGrocery;
        if (plan.pantry) state.pantry = plan.pantry;
        if (plan.alexaOnlyItems) state.alexaOnlyItems = plan.alexaOnlyItems;
        if (plan.alexaSyncTime) state.alexaSyncTime = plan.alexaSyncTime;
        if (plan.ratings) state.ratings = plan.ratings;
        if (plan.activeRecipes) state.activeRecipes = plan.activeRecipes;
      setSyncStatus("saved");
    }
  } catch(e) { console.error("Load error:", e); setSyncStatus("offline"); }
}

async function saveToSupabase() {
  if (!supabase) { saveToLocal(); return; }
  setSyncStatus("saving");
  try {
    const plan = { breakfasts: state.breakfasts, lunches: state.lunches, dinners: state.dinners, desserts: state.desserts, swaps: state.swaps, spiceBlends: state.spiceBlends, userEmail: state.userEmail, wifeEmail: state.wifeEmail, store: state.store, grocery: state.grocery, useStaticGrocery: state.useStaticGrocery, pantry: state.pantry, alexaOnlyItems: state.alexaOnlyItems, alexaSyncTime: state.alexaSyncTime, ratings: state.ratings, activeRecipes: state.activeRecipes };
    await supabase.from("meal_plan").upsert({ id: "family", plan, updated_at: new Date().toISOString() });
    saveToLocal();
    setSyncStatus("saved");
  } catch(e) { console.error("Save error:", e); setSyncStatus("offline"); saveToLocal(); }
}

function tags(item) {
  const t = [];
  if (item.calories) t.push(`<span class="tag tag-green">${item.calories} cal</span>`);

  if (item.activeTime) t.push(`<span class="tag tag-amber">⏱ ${esc(item.activeTime)}</span>`);
  if (item.serves)   t.push(`<span class="tag tag-muted">${esc(item.serves)}</span>`);
  if (item.kidFriendly) t.push(`<span class="tag tag-pink">👧 Kid-friendly</span>`);
  if (item.prepNote) t.push(`<span class="tag tag-green">📦 Prep-ahead</span>`);
  if (item.hiddenVeg) t.push(`<span class="tag tag-purple">🥦 Hidden veg</span>`);
  const r = (state.ratings||{})[item.id];
  if (r&&r.stars) {
    const stars = "⭐".repeat(r.stars) + (r.stars < 5 ? "☆".repeat(5-r.stars) : "");
    t.push(`<span class="tag tag-amber" title="${r.note||""}">${stars}</span>`);
  }
  return t.join("");
}

function hasSwaps(item) {
  return (item.ingredients||[]).some(i => i.includes("Mission Carb") || i.includes("Brami") || i.includes("Frik") || i.includes("0% Greek") || i.includes("reduced-fat") || i.includes("light butter") || i.includes("Good Culture") || i.includes("96/4") || i.includes("Amylu") || i.includes("Jennie-O") || i.includes("Wellshire") || i.includes("Fairlife"));
}

function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").style.display = "flex";
}
function closeModal(e) {
  if (!e || e.target === document.getElementById("modal")) {
    document.getElementById("modal").style.display = "none";
  }
}
function closeModalForce() {
  document.getElementById("modal").style.display = "none";
}

function viewRecipe(section, id) {
  const list = section === "breakfast" ? state.breakfasts : section === "lunch" ? state.lunches : state.dinners;
  const item = list.find(x => x.id === id);
  if (!item) return;

  const scale = scaleFactors[item.id] || 1;
  function scaleIngr(ing) {
    return ing.replace(/(\d+(\.\d+)?)/g, (m) => {
      const n = parseFloat(m) * scale;
      return n % 1 === 0 ? String(n) : n.toFixed(1).replace(/\.0$/, "");
    });
  }
  const ingrHtml = (item.ingredients || []).map(ing => {
    if (ing.startsWith("---")) return `<div class="ingredient-section">${esc(ing.replace(/---/g,"").trim())}</div>`;
    return `<div class="ingredient-item"><span class="ingredient-bullet">●</span><span>${esc(scale===1?ing:scaleIngr(ing))}</span></div>`;
  }).join("");

  const stepsHtml = (item.instructions || []).map((s,i) =>
    `<div class="recipe-step"><div class="step-num">${i+1}</div><div style="color:#cbd5e1;font-size:13px;line-height:1.65">${esc(s)}</div></div>`
  ).join("");

  const notesHtml = [
    item.prepNote ? `<div class="info-box green"><span class="info-label" style="color:var(--green)">📦 PREP:</span>${esc(item.prepNote)}</div>` : "",
    item.leftoverNote ? `<div class="info-box amber"><span class="info-label" style="color:var(--amber)">♻️ EFFICIENCY:</span>${esc(item.leftoverNote)}</div>` : "",
    item.hiddenVeg ? `<div class="info-box purple"><span class="info-label" style="color:var(--purple)">🥦 HIDDEN VEG:</span>${esc(item.hiddenVeg)}</div>` : "",
    item.tips ? `<div class="info-box tip"><span class="info-label" style="color:#fbbf24">💡</span>${esc(item.tips)}</div>` : "",
    item.sourceUrl ? `<div style="font-size:12px;color:var(--dim);margin-top:8px">Source: <a href="${esc(item.sourceUrl)}" target="_blank" style="color:var(--indigo)">${esc(item.source||item.sourceUrl)}</a></div>` : "",
  ].join("");

  openModal(`
    <div class="modal-header">
      <div>
        <div style="font-size:28px;margin-bottom:4px">${item.emoji}</div>
        <div class="modal-title">${esc(item.name)}</div>
        <div style="color:var(--dim);font-size:13px;margin-top:4px">${esc(item.description)}</div>
        <div class="tags" style="margin-top:8px">${tags(item)}</div>
      </div>
      <button class="modal-close" onclick="closeModalForce()">✕</button>
    </div>
    <div class="scale-row">
      <span style="font-size:12px;color:var(--muted);font-weight:600">Servings:</span>
      <button class="scale-btn" onclick="changeScale('${item.id}','${section}',-1)">−</button>
      <div class="scale-display">${scale}× <span style="color:var(--dim);font-size:11px">(${Math.round((parseInt(item.serves)||4)*scale)} servings)</span></div>
      <button class="scale-btn" onclick="changeScale('${item.id}','${section}',1)">+</button>
    </div>
    ${notesHtml}
    <div class="recipe-tabs">
      <button class="recipe-tab active" id="rtab-ing" onclick="switchRecipeTab('ing')">Ingredients</button>
      <button class="recipe-tab" id="rtab-steps" onclick="switchRecipeTab('steps')">Instructions</button>
    </div>
    <div id="rcontent-ing">${ingrHtml}</div>
    <div id="rcontent-steps" style="display:none">${stepsHtml}</div>
    ${buildRatingHtml(item.id, section)}
    <div style="display:flex;gap:8px;margin-top:16px;border-top:1px solid var(--border);padding-top:16px">
      <button style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--indigo);background:transparent;color:var(--indigo);font-weight:600;font-size:13px;cursor:pointer" onclick="closeModalForce();editItem('${section}','${id}')">✏️ Edit</button>
      <button style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--red);background:transparent;color:var(--red);font-weight:600;font-size:13px;cursor:pointer" onclick="deleteItem('${section}','${id}')">🗑 Remove</button>
    </div>
  `);
}

function changeScale(id, section, delta) {
  const cur = scaleFactors[id] || 1;
  const next = Math.max(0.5, Math.min(4, cur + delta * 0.5));
  scaleFactors[id] = Math.round(next * 2) / 2; // snap to 0.5 increments
  viewRecipe(section, id); // re-render modal with new scale
}

function switchRecipeTab(t) {
  document.getElementById("rtab-ing").classList.toggle("active", t==="ing");
  document.getElementById("rtab-steps").classList.toggle("active", t==="steps");
  document.getElementById("rcontent-ing").style.display = t==="ing" ? "" : "none";
  document.getElementById("rcontent-steps").style.display = t==="steps" ? "" : "none";
}

function deleteItem(section, id) {
  if (!confirm("Remove this recipe?")) return;
  const setter = s => { if (section==="breakfast") state.breakfasts=s; else if (section==="lunch") state.lunches=s; else if (section==="dessert") state.desserts=s; else state.dinners=s; };
  const list = section==="breakfast" ? state.breakfasts : section==="lunch" ? state.lunches : section==="dessert" ? state.desserts : state.dinners;
  setter(list.filter(x => x.id !== id));
  closeModalForce();
  scheduleSave();
  renderTab(currentTab);
}

function editItem(section, id) {
  const list = section==="breakfast" ? state.breakfasts : section==="lunch" ? state.lunches : state.dinners;

  showEditModal(section, item);
}

  const f = id => (document.getElementById(id)||{}).value || "";
  const item = {
    id:           f("ef-id") || uid(),
    name:         f("ef-name"),
    emoji:        f("ef-emoji") || "🍽️",
    description:  f("ef-desc"),
    calories:     Number(f("ef-cal")) || 0,
    protein:      Number(f("ef-prot")) || 0,
    activeTime:   f("ef-active"),
    totalTime:    f("ef-total"),
    serves:       f("ef-serves"),
    day:          f("ef-day") || undefined,
    kidFriendly:  (document.getElementById("ef-kids")||{}).checked || false,

    leftoverNote: f("ef-leftover"),

    instructions: f("ef-steps").split("\n").map(s=>s.trim()).filter(Boolean),
  };

}

async function parseImportCaption(section) {
  const text = (document.getElementById("import-text")||{}).value.trim();
  if (!text) { alert("Please paste some recipe text first."); return; }
  await runImportParser(section, { type: "text", content: text });
}

async function parseImportUrl(section) {
  const url = (document.getElementById("import-url")||{}).value.trim();
  if (!url) { alert("Please enter a URL first."); return; }
  await runImportParser(section, { type: "url", content: url });
}

async function parseImportPhoto(section, input) {
  const file = (input&&input.files&&input.files[0]);
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(",")[1];
    const mimeType = file.type || "image/jpeg";
    await runImportParser(section, { type: "image", base64, mimeType });
  };
  reader.readAsDataURL(file);
}

async function parseImport(section) {
  const text = (document.getElementById("import-text")||{}).value.trim();
  if (!text) return;
  await runImportParser(section, { type: "text", content: text });
}

async function runImportParser(section, input) {
  const loadingEmoji = input.type === "url" ? "🔗" : input.type === "image" ? "📸" : "📲";
  const loadingMsg  = input.type === "url" ? "Fetching recipe from URL..." : input.type === "image" ? "Reading recipe from photo..." : "Parsing recipe text...";

  document.getElementById("modalBox").innerHTML = `
    <div style="text-align:center;padding:50px 20px">
      <div style="font-size:44px;margin-bottom:16px">${loadingEmoji}</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:8px">${loadingMsg}</div>
      <div style="color:var(--dim);font-size:13px">Extracting ingredients, steps and estimating macros</div>
    </div>`;

  const dayHint = section==="dinner" ? '"day":"Monday",' : "";
  let messageContent;
  if (input.type === "image") {
    messageContent = [
      { type: "image", source: { type: "base64", media_type: input.mimeType, data: input.base64 }},
      { type: "text", text: "Extract the complete recipe from this image. Parse all ingredients and instructions you can see." }
    ];
  } else if (input.type === "url") {
    messageContent = `Fetch and parse the recipe at this URL: ${input.content}\n\nIf it's an Instagram URL, extract the recipe from the post caption. If it's a recipe website, extract the full recipe. Use web_search if needed to find the content.`;
  } else {
    messageContent = "Parse this recipe:\n\n" + input.content;
  }

  try {
    const tools = input.type === "url" ? [{ type: "web_search_20250305", name: "web_search" }] : undefined;
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json","anthropic-beta":"claude-ai-artifact-preview","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:1500,
        ...(tools ? { tools } : {}),
        system:`You are a recipe parser. Return ONLY a raw JSON object, no markdown. Format: {"name":"...","emoji":"🍽️","description":"one sentence","calories":500,"protein":40,"activeTime":"15 min","totalTime":"30 min","serves":"4 servings",${dayHint}"kidFriendly":false,"prepNote":"","ingredients":["..."],"instructions":["..."],"tips":"one tip","sourceUrl":"if URL provided"} Estimate calories/protein for family of 4 if not stated. For URL inputs, fetch the page content and extract the full recipe.`,
        messages:[{role:"user", content: messageContent}]
      })
    });
    const data = await res.json();
    const raw = (data.content||[]).find(b=>b.type==="text").text||"";
    const match = raw.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);
    if (!match) throw new Error("Could not parse");
    const recipe = JSON.parse(match[0]);
    const swapped = applySwaps(recipe.ingredients||[]);
    const diff = getSwapDiff(recipe.ingredients||[], swapped);
    recipe.ingredients = swapped;
    recipe.id = uid();

    const diffHtml = diff.length ? `
      <div class="info-box green" style="margin-bottom:12px">
        <span style="color:var(--green);font-weight:700">✅ ${diff.length} auto-swap${diff.length>1?"s":""} applied</span>
        ${diff.map(s=>`<div style="font-size:12px;margin-top:4px;display:flex;gap:6px"><span style="color:var(--red);text-decoration:line-through">${esc(s.from)}</span><span style="color:var(--green)">→</span><span>${esc(s.to)}</span></div>`).join("")}
      </div>` : "";

    const ingrPreview = (recipe.ingredients||[]).slice(0,6).map(i=>`<div class="ingredient-item"><span class="ingredient-bullet">●</span><span>${esc(i)}</span></div>`).join("")
      + ((recipe.ingredients||[]).length>6 ? `<div style="color:var(--dim);font-size:12px;padding-top:4px">+${recipe.ingredients.length-6} more...</div>` : "");

    const previewData = btoa(unescape(encodeURIComponent(JSON.stringify(recipe))));
    document.getElementById("modalBox").innerHTML = `
      <div class="modal-header">

function confirmImport(section, encoded) {
  const recipe = JSON.parse(decodeURIComponent(escape(atob(encoded))));
  const setter = s => { if (section==="breakfast") state.breakfasts=s; else if (section==="lunch") state.lunches=s; else if (section==="dessert") state.desserts=s; else state.dinners=s; };
  const list = section==="breakfast" ? state.breakfasts : section==="lunch" ? state.lunches : section==="dessert" ? state.desserts : state.dinners;
  setter([...list, recipe]);
  closeModalForce();
  scheduleSave();
  renderTab(currentTab);
}

function buildSmartGroceryList() {
  const allRecipes = [
    ...state.dinners,
    ...state.breakfasts,
    ...state.lunches,
    ...state.desserts,
  ].filter(r => isActive(r.id));
  const CAT_RULES = [
    { cat:"🥩 Protein & Meat",    re:/chicken|turkey(?! bacon)|salmon|fish|beef|steak|pork|shrimp|ground|deli|rotisserie|amylu|jennie|wellshire/i },
    { cat:"🥓 Deli & Sausage",    re:/turkey bacon|sausage|bacon|deli/i },
    { cat:"🥛 Dairy & Eggs",      re:/egg|milk|fairlife|yogurt|fage|cream cheese|cheddar|mozzarella|provolone|butter|cottage/i },
    { cat:"🥦 Produce",           re:/spinach|zucchini|carrot|onion|garlic|potato|asparagus|broccoli|tomato|lemon|lime|pepper|mushroom|lettuce|banana|berry|strawberry|parsley|thyme|rosemary|ginger|basil|herb|avocado|kale|celery|cucumber/i },
    { cat:"🌾 Pantry & Grains",   re:/pasta|brami|oat|rice|flour|bread|panko|breadcrumb|oil|avocado oil|butter(?! milk)|honey|maple|vinegar|stock|broth|sugar|salt|baking/i },
    { cat:"🥫 Canned & Jarred",   re:/sauce|marinara|rao|frik|diced tomato|tomato|chickpea|bean|lentil|water chestnut|hummus|hoisin|soy sauce|sesame/i },
    { cat:"🧂 Seasonings & Misc", re:/.*/i },
  ];
  const raw = [];
  allRecipes.forEach(r => {
    (r.ingredients || []).forEach(ing => {
      if (ing.startsWith("---") || ing.startsWith("Option ")) return;
      if (ing.trim()) raw.push({ text: ing.trim(), source: r.name });
    });
  });
  const seen = new Map();
  raw.forEach(({text, source}) => {
    const key = text.toLowerCase().replace(/^[\d\s\/½¼¾tbspcup.oz,]+/, "").slice(0,25).trim();
    if (!seen.has(key)) seen.set(key, { text, sources: [source] });
    else seen.get(key).sources.push(source);
  });
  const cats = CAT_RULES.map(({cat, re}) => ({cat, items:[]}));
  seen.forEach(({text, sources}) => {
    let placed = false;
    for (let i = 0; i < CAT_RULES.length - 1; i++) {
      if (CAT_RULES[i].re.test(text)) {
        cats[i].items.push({text, sources});
        placed = true;
        break;
      }
    }
    if (!placed) cats[cats.length-1].items.push({text, sources});
  });

  return cats.filter(c => c.items.length > 0);
}

function editSwap(id) { /* simplified — opens edit form */ const s = state.swaps.find(x=>x.id===id); if(s) showAddSwapModal(s); }
function deleteSwap(id) { if(!confirm("Remove this swap?")) return; state.swaps = state.swaps.filter(x=>x.id!==id); scheduleSave(); renderSwaps(); }
function editBlend(id) { const b = state.spiceBlends.find(x=>x.id===id); if(b) showAddBlendModal(b); }
function deleteBlend(id) { if(!confirm("Remove this blend?")) return; state.spiceBlends = state.spiceBlends.filter(x=>x.id!==id); scheduleSave(); renderSwaps(); }

function showAddSwapModal(s={}) {
  openModal(`
    <div class="modal-header"><div class="modal-title">${s.id?"Edit Swap":"Add Swap"}</div><button class="modal-close" onclick="closeModalForce()">✕</button></div>
    <input type="hidden" id="sw-id" value="${esc(s.id||"")}">
    ${[["Upgrade Name","sw-upgrade",s.upgrade||""],["Category","sw-cat",s.category||""],["Replaces","sw-orig",s.original||""],["Benefit","sw-benefit",s.benefit||""],["Protein Impact","sw-prot",s.protein||""],["Where to Buy","sw-where",s.where||""]].map(([l,id,v])=>`<label class="form-label">${l}</label><input class="form-input" id="${id}" value="${esc(v)}">`).join("")}
    <label class="form-label">Used In (comma separated)</label>
    <input class="form-input" id="sw-applies" value="${esc((s.applies||[]).join(", "))}">
    <label class="form-label">Notes</label>
    <textarea class="form-input" id="sw-note">${esc(s.note||"")}</textarea>
    <button class="btn-primary" onclick="saveSwap()">✅ Save</button>
  `);
}

function saveSwap() {
  const f = id => (document.getElementById(id)||{}).value||"";
  const saved = { id: f("sw-id")||uid(), upgrade:f("sw-upgrade"), category:f("sw-cat"), original:f("sw-orig"), benefit:f("sw-benefit"), protein:f("sw-prot"), where:f("sw-where"), applies:f("sw-applies").split(",").map(s=>s.trim()).filter(Boolean), note:f("sw-note"), emoji:"🔄" };
  const exists = state.swaps.find(s=>s.id===saved.id);
  state.swaps = exists ? state.swaps.map(s=>s.id===saved.id?saved:s) : [...state.swaps, saved];
  closeModalForce(); scheduleSave(); renderSwaps();
}

function showAddBlendModal(b={}) {

async function syncAlexaList() {
  const btn = document.getElementById("alexa-sync-btn");
  const status = document.getElementById("alexa-sync-status");
  if (btn) btn.style.opacity = "0.6";
  setAlexaStatus("loading", "🔍 Searching Gmail for Alexa shopping list email...");

  try {
    const searchRes = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "anthropic-beta": "claude-ai-artifact-preview", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `You have access to Gmail via MCP. Search for the most recent email from Amazon Alexa containing a shopping list.
        Search query: from:alexa OR subject:"shopping list" OR subject:"Alexa" newer_than:30d
        If found, extract EVERY item from the shopping list — return them as a JSON array of strings, one item per entry.
        If not found, return {"error": "No Alexa shopping list email found in the last 30 days"}.
        Return ONLY raw JSON, no markdown, no preamble.`,
        messages: [{ role: "user", content: "Find the most recent Alexa shopping list email in my Gmail and extract all items as a JSON array." }],
        mcp_servers: [{ type: "url", url: "https://gmailmcp.googleapis.com/mcp/v1", name: "gmail" }]
      })
    });

    const data = await searchRes.json();
    const raw = (data.content||[]).find(b => b.type === "text").text || "";
    const cleaned = raw.replace(/```json|```/g, "").trim();
    const match = cleaned.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
    if (!match) throw new Error("Could not parse Gmail response");

    const parsed = JSON.parse(match[0]);

    if (parsed.error) {
      setAlexaStatus("warn", "⚠️ " + parsed.error + " — try saying \"Alexa, email me my shopping list\" first.");
      if (btn) btn.style.opacity = "1";
      return;
    }

    const alexaItems = Array.isArray(parsed) ? parsed : (parsed.items || []);
    if (!alexaItems.length) {
      setAlexaStatus("warn", "⚠️ No items found in the email. Make sure Alexa emailed your list.");
      if (btn) btn.style.opacity = "1";
      return;
    }
    setAlexaStatus("loading", `✅ Found ${alexaItems.length} Alexa items — deduplicating with recipe list...`);

    const recipeItems = buildSmartGroceryList().flatMap(c => c.items.map(i => typeof i === "string" ? i : i.text));

    const mergeRes = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "anthropic-beta": "claude-ai-artifact-preview", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `You are a grocery list deduplicator. Merge two lists into one clean combined list.
        Rules:
        - If an Alexa item is the same ingredient as a recipe item (even if worded differently), keep ONE entry — prefer the recipe version as it has quantity info.
        - If an Alexa item is NOT in the recipe list, ADD it to the combined list.
        - Normalize item names: "chix thighs" = "chicken thighs", "2% milk" = "Fairlife 2% milk" etc.
        - Return a JSON object: {"merged": ["item1","item2",...], "alexa_only": ["item1",...], "duplicates_removed": ["item1",...]}
        - merged = full deduplicated list (recipe items + unique Alexa additions)
        - alexa_only = items from Alexa that were NOT in recipe list (net new additions)
        - duplicates_removed = items that appeared in both and were collapsed
        Return ONLY raw JSON, no markdown.`,
        messages: [{
          role: "user",
          content: "Alexa list: " + JSON.stringify(alexaItems) + "\n\nRecipe list: " + JSON.stringify(recipeItems)
        }]
      })
    });

    const mergeData = await mergeRes.json();
    const mergeRaw = mergeData.content.find(b => b.type === "text").text || "";
    const mergeMatch = mergeRaw.replace(/```json|```/g, "").trim().match(/\{[\s\S]*\}/);
    if (!mergeMatch) throw new Error("Could not parse merge response");

    const mergeResult = JSON.parse(mergeMatch[0]);
    const { merged = [], alexa_only = [], duplicates_removed = [] } = mergeResult;
    state.alexaMergedList = merged;
    state.alexaOnlyItems  = alexa_only;
    state.alexaSyncTime   = new Date().toLocaleTimeString();
    scheduleSave();

    const msg = `✅ Synced! Added ${alexa_only.length} item${alexa_only.length !== 1 ? "s" : ""} from Alexa · Removed ${duplicates_removed.length} duplicate${duplicates_removed.length !== 1 ? "s" : ""} · ${merged.length} total items`;
    setAlexaStatus("ok", msg);
    renderGrocery(); // re-render to show merged list

  } catch(e) {
    console.error("Alexa sync error:", e);
    setAlexaStatus("error", "❌ " + (e.message || "Something went wrong. Try again."));
  }
  if (btn) btn.style.opacity = "1";
}

function setAlexaStatus(type, msg) {

  el.style.display = "block";

  const bgs    = { loading: "rgba(100,116,139,0.08)", ok: "rgba(16,185,129,0.08)", warn: "rgba(245,158,11,0.08)", error: "rgba(239,68,68,0.08)" };
  el.style.color = colors[type] || "#94a3b8";

  el.textContent = msg;
}

function setStars(id, section, stars) {
  if (!state.ratings) state.ratings = {};
  const cur = state.ratings[id] || {};

  scheduleSave();
  viewRecipe(section, id); // re-render modal
}

function toggleChip(id, section, chip) {
  if (!state.ratings) state.ratings = {};
  const cur = state.ratings[id] || {};
  const chips = cur.chips || [];
  state.ratings[id] = {
    ...cur,
    chips: chips.includes(chip) ? chips.filter(c => c !== chip) : [...chips, chip],
    date: cur.date || new Date().toISOString()
  };
  scheduleSave();
  viewRecipe(section, id);
}

        <div class="cook-recipe-meta">${r.section==="dinner"?r.day+" · ":""}${r.instructions.length} steps${r.activeTime?" · "+esc(r.activeTime):""}</div>
        <div class="cook-recipe-tags">
          ${r.calories?`<span class="cook-tag cook-tag-green">${r.calories} cal</span>`:""}
          ${r.protein?`<span class="cook-tag cook-tag-amber">${r.protein}g protein</span>`:""}
          ${r.hiddenVeg?`<span class="cook-tag cook-tag-purple">🥦 hidden veg</span>`:""}
        </div>
      </div>
      <span style="color:#374151;font-size:24px">›</span>
    </button>`).join("");
  document.getElementById("page-cook").innerHTML=`<div class="cook-home"><div class="cook-home-title">👨‍🍳 What are we cooking?</div><div class="cook-home-sub">Tap a recipe to start step-by-step cook mode</div>${cards}</div>`;
}

function startCooking(section,id) {
  const list=section==="breakfast"?state.breakfasts:section==="lunch"?state.lunches:state.dinners;
  const recipe=list.find(r=>r.id===id); if(!recipe)return;
  cookState={recipe,step:0,mode:"steps",checkedIngr:{},timer:{seconds:0,running:false,interval:null,_original:0}};
  renderCookScreen();
}

function renderCookScreen() {
  const {recipe,step,mode}=cookState;
  const steps=recipe.instructions||[],ingrs=recipe.ingredients||[],total=steps.length;
  const pct=total>0?Math.round((step/total)*100):0,isDone=step>=total;

  const header=`
    <div class="cook-header">
      <button class="cook-back-btn" onclick="exitCook()">←</button>
      <div style="flex:1">
        <div class="cook-recipe-title">${esc(recipe.name)}</div>
        <div class="cook-step-count">${isDone?"Complete! 🎉":"Step "+(step+1)+" of "+total}</div>
        <div class="cook-progress-bar"><div class="cook-progress-fill" style="width:${pct}%"></div></div>
      </div>
      <span style="font-size:32px">${recipe.emoji}</span>
    </div>
    <div class="cook-mode-tabs">
      <button class="cook-mode-tab ${mode==="steps"?"active":""}" onclick="setCookMode('steps')">📋 Steps</button>
      <button class="cook-mode-tab ${mode==="ingredients"?"active":""}" onclick="setCookMode('ingredients')">🧂 Ingredients</button>
    </div>`;

  let body="";
  if(isDone) {
    body=`<div class="cook-done">
      <div class="cook-done-emoji">🎉</div>
      <div class="cook-done-title">That's it!</div>
      <div class="cook-done-sub">${esc(recipe.name)} is ready.<br>${recipe.tips?'"'+esc(recipe.tips)+'"':"Time to eat!"}</div>
      <div style="background:#111827;border:2px solid #1f2937;border-radius:16px;padding:18px;margin:16px 0;width:100%;text-align:left">
        <div style="color:#10b981;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">⏰ Rate it tomorrow morning</div>
        <div style="color:#9ca3af;font-size:13px;line-height:1.5">A reminder will fire at 8am — tap it to rate <strong style="color:#f9fafb">${esc(recipe.name)}</strong> while it's fresh.</div>
      </div>
      <button onclick="scheduleRatingReminder('${recipe.id}','${esc(recipe.name)}','${recipe.section||'dinner'}')" style="width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:10px">✅ Set 8am rating reminder</button>
      <button class="cook-done-btn" onclick="exitCook()">← Back to recipes</button>
    </div>`;
  } else if(mode==="ingredients") {
    const items=ingrs.map((ing,i)=>{
      if(ing.startsWith("---"))return`<div class="cook-ingr-section">${esc(ing.replace(/---/g,"").trim())}</div>`;
      const checked=cookState.checkedIngr[i]?"checked":"";
      return`<div class="cook-ingr-item ${checked}" onclick="toggleCookIngr(${i},this)"><div class="cook-ingr-check">${checked?"✓":""}</div><div class="cook-ingr-text">${esc(ing)}</div></div>`;
    }).join("");
    body=`<div class="cook-ingr-view">${items}</div>`;
  } else {
    const stepText=steps[step]||"";
    const timerMatch=stepText.match(/(\d+)\s*(hour|hr|minute|min|second|sec)/i);
    let timerHtml="";
    if(timerMatch){
      const num=parseInt(timerMatch[1]),unit=timerMatch[2].toLowerCase();
      let secs=unit.startsWith("h")?num*3600:unit.startsWith("m")?num*60:num;
      if(!cookState.timer.running&&cookState.timer.seconds===0){cookState.timer.seconds=secs;cookState.timer._original=secs;}
      const t=cookState.timer,disp=formatTimer(t.seconds),cls=t.running?"running":(t.seconds===0&&t._original>0?"done":"");
      timerHtml=`<div class="cook-timer"><div class="cook-timer-display ${cls}" id="cook-timer-display">${disp}</div><button class="cook-timer-btn" onclick="toggleTimer()">${t.running?"⏸":"▶"}</button><button class="cook-timer-btn" onclick="resetTimer(${secs})">⟳</button></div>`;
    }
    const tipHtml=(step===total-1&&recipe.tips)?`<div class="cook-tip-box"><div class="cook-tip-label">💡 Pro tip</div><div class="cook-tip-text">${esc(recipe.tips)}</div></div>`:"";
    const hvHtml=(step===0&&recipe.hiddenVeg)?`<div style="background:rgba(139,92,246,0.1);border:2px solid rgba(139,92,246,0.3);border-radius:14px;padding:14px 18px;margin-bottom:20px"><div style="color:#a78bfa;font-size:13px;font-weight:700;margin-bottom:4px">🥦 HIDDEN VEG</div><div style="color:#d1d5db;font-size:15px">${esc(recipe.hiddenVeg)}</div></div>`:"";
    body=`<div class="cook-step-view"><div class="cook-step-content">${hvHtml}<div class="cook-step-num-badge">Step ${step+1} of ${total}</div><div class="cook-step-text">${esc(stepText)}</div>${timerHtml}${tipHtml}</div><div class="cook-nav"><button class="cook-nav-btn cook-nav-prev" onclick="cookPrev()" ${step===0?"disabled style='opacity:0.3'":" "}>← Prev</button><button class="cook-nav-btn cook-nav-next ${step===total-1?"done":""}" onclick="cookNext()">${step===total-1?"Done 🎉":"Next →"}</button></div></div>`;
  }
  document.getElementById("page-cook").innerHTML=`<div class="cook-screen">${header}${body}</div>`;
}

function formatTimer(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h>0?h+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0"):String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");}

function toggleTimer(){
  const t=cookState.timer;
  if(t.running){clearInterval(t.interval);t.running=false;}
  else{
    if(t.seconds<=0)return; t.running=true;
    t.interval=setInterval(()=>{
      t.seconds--;
      const el=document.getElementById("cook-timer-display");
      if(el){el.textContent=formatTimer(t.seconds);el.className="cook-timer-display "+(t.seconds>0?"running":"done");}
      if(t.seconds<=0){
        clearInterval(t.interval);t.running=false;
        try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,300,600].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.setValueAtTime(0.3,ctx.currentTime+d/1000);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d/1000+0.3);o.start(ctx.currentTime+d/1000);o.stop(ctx.currentTime+d/1000+0.3);});}catch(e){}
      }
    },1000);
  }
  renderCookScreen();
}

function resetTimer(secs){clearInterval(cookState.timer.interval);cookState.timer={seconds:secs,_original:secs,running:false,interval:null};renderCookScreen();}
function cookNext(){clearInterval(cookState.timer.interval);cookState.timer={seconds:0,running:false,interval:null,_original:0};cookState.step=Math.min(cookState.step+1,cookState.recipe.instructions.length);renderCookScreen();}
function cookPrev(){clearInterval(cookState.timer.interval);cookState.timer={seconds:0,running:false,interval:null,_original:0};cookState.step=Math.max(cookState.step-1,0);renderCookScreen();}
function setCookMode(mode){cookState.mode=mode;renderCookScreen();}
function toggleCookIngr(i,el){cookState.checkedIngr[i]=!cookState.checkedIngr[i];el.classList.toggle("checked",cookState.checkedIngr[i]);el.querySelector(".cook-ingr-check").textContent=cookState.checkedIngr[i]?"✓":"";}
function exitCook(){clearInterval(cookState.timer.interval);cookState={recipe:null,step:0,mode:"steps",checkedIngr:{},timer:{seconds:0,running:false,interval:null,_original:0}};renderCookHome();}

async function exportToPaprika() {
  const allRecipes = [
    ...state.dinners,
    ...state.breakfasts,
    ...state.lunches,
    ...state.desserts,
  ].filter(r => isActive(r.id));
  const paprikaRecipes = allRecipes.map(r => {
    const ingredients = (r.ingredients || [])
      .filter(i => !i.startsWith("---"))
      .join("\n");
    const directions = (r.instructions || [])
      .map((s, i) => (i+1) + ". " + s)
      .join("\n\n");
    const notes = [
      r.tips ? "💡 " + r.tips : "",
      r.hiddenVeg ? "🥦 Hidden veg: " + r.hiddenVeg : "",
      r.leftoverNote ? "♻️ " + r.leftoverNote : "",
      r.source ? "Source: " + r.source : "",
    ].filter(Boolean).join("\n\n");

    return {
      uid:          r.id || uid(),
      name:         r.name || "Untitled",
      ingredients:  ingredients,
      directions:   directions,
      notes:        notes,
      description:  r.description || "",
      source:       r.source || "Lemmon Family Meal Planner",
      source_url:   r.sourceUrl || "",
      prep_time:    r.activeTime || "",
      cook_time:    r.totalTime || "",
      servings:     r.serves || "4",
      nutritional_info: [
        r.calories ? "Calories: " + r.calories : "",
        r.protein  ? "Protein: "  + r.protein + "g" : "",
      ].filter(Boolean).join(" | "),
      categories:   r.kidFriendly ? ["Family","Kid-Friendly"] : ["Family"],
      photo_hash:   null,
      photo:        null,
      rating:       0,
      difficulty:   "",
      on_favorites: false,
      in_trash:     false,
      scale:        null,
      hash:         uid(),
      created:      new Date().toISOString(),
    };
  });
  try {
    const { default: JSZip } = await import("https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm");

    const zip = new JSZip();

    for (const recipe of paprikaRecipes) {
      const json = JSON.stringify(recipe);
      const filename = recipe.name.replace(/[^a-zA-Z0-9 ]/g, "").trim() + ".paprikarecipe";
      zip.file(filename, json, { compression: "DEFLATE", compressionOptions: { level: 6 } });
    }

    const blob = await zip.generateAsync({ type: "blob", mimeType: "application/zip" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "LemmonFamilyRecipes.paprikarecipes";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showExportStatus("✅ Downloaded! Open Paprika 3 → Settings → Import → select the file.");
  } catch(e) {
    console.error("Export error:", e);
    showExportStatus("⚠️ Export failed: " + e.message);
  }
}

function showExportStatus(msg) {
  const el = document.getElementById("paprika-status");
  if (el) { el.textContent = msg; el.style.display = "block"; }
}

async function importFromPaprika(file) {
  if (!file) return;
  showImportStatus("Reading file...");

  try {
    const { default: JSZip } = await import("https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm");
    const zip = await JSZip.loadAsync(file);
    const imported = { dinners:[], breakfasts:[], lunches:[], skipped:0 };

    for (const [filename, zipEntry] of Object.entries(zip.files)) {
      if (zipEntry.dir) continue;
      try {
        let jsonStr;
        try {
          jsonStr = await zipEntry.async("string");
          if (jsonStr.charCodeAt(0) === 31 && jsonStr.charCodeAt(1) === 139) {
            throw new Error("binary");
          }
        } catch(e) {
          const bytes = await zipEntry.async("uint8array");
          const ds = new DecompressionStream("gzip");
          const writer = ds.writable.getWriter();
          const reader = ds.readable.getReader();
          writer.write(bytes);
          writer.close();
          const chunks = [];
          let done = false;
          while (!done) {
            const { value, done: d } = await reader.read();
            if (value) chunks.push(value);
            done = d;
          }
          const totalLen = chunks.reduce((a, c) => a + c.length, 0);
          const merged = new Uint8Array(totalLen);
          let offset = 0;
          for (const c of chunks) { merged.set(c, offset); offset += c.length; }
          jsonStr = new TextDecoder().decode(merged);
        }

        const r = JSON.parse(jsonStr);
        if (!r.name || !r.directions) { imported.skipped++; continue; }
        const ingredients = (r.ingredients || "")
          .split("\n")
          .map(s => s.trim())
          .filter(Boolean);

        const instructions = (r.directions || "")
          .split("\n")
          .map(s => s.trim())
          .filter(Boolean)
          .map(s => s.replace(/^\d+[.)\s]+/, "").trim())
          .filter(Boolean);
        const notes = r.notes || "";
        const tips = (notes.match(/💡 (.+?)(?:\n|$)/)||[])[1] || "";
        const hiddenVeg = (notes.match(/🥦 Hidden veg: (.+?)(?:\n|$)/)||[])[1] || "";
        const leftoverNote = (notes.match(/♻️ (.+?)(?:\n|$)/)||[])[1] || "";

        const recipe = {
          id: r.uid || uid(),
          name: r.name,
          emoji: guessEmoji(r.name, r.categories || []),
          description: r.description || "",
          calories: parseNutri(r.nutritional_info, "Calories"),
          protein: parseNutri(r.nutritional_info, "Protein"),
          activeTime: r.prep_time || "",
          totalTime: r.cook_time || "",
          serves: r.servings || "4 servings",
          kidFriendly: (r.categories || []).some(c => c.toLowerCase().includes("kid")),
          source: r.source || "Paprika",
          sourceUrl: r.source_url || "",
          tips,
          hiddenVeg,
          leftoverNote,
          ingredients: applySwaps(ingredients),
          instructions,
        };
        const cats = (r.categories || []).map(c => c.toLowerCase());
        if (cats.some(c => c.includes("breakfast"))) imported.breakfasts.push(recipe);
        else if (cats.some(c => c.includes("lunch") || c.includes("salad") || c.includes("sandwich"))) imported.lunches.push(recipe);
        else imported.dinners.push(recipe);

      } catch(e) { imported.skipped++; }
    }

    const total = imported.dinners.length + imported.breakfasts.length + imported.lunches.length;
    if (total === 0) {
      showImportStatus("⚠️ No recipes found in file. Make sure you exported as Paprika Recipe Format (.paprikarecipes).");
      return;
    }
    showImportPreview(imported, total);

  } catch(e) {
    console.error("Import error:", e);
    showImportStatus("⚠️ Could not read file: " + e.message);
  }
}

function parseNutri(nutri, field) {
  if (!nutri) return 0;
  const match = nutri.match(new RegExp(field + ":\\s*(\\d+)"));
  return match ? parseInt(match[1]) : 0;
}

function guessEmoji(name, categories) {
  const n = (name || "").toLowerCase();
  const emojis = [
    [/chicken|poultry|turkey(?! bacon)/,"🍗"],[/salmon|fish|cod|tuna|seafood|shrimp|prawn/,"🐟"],
    [/beef|steak|burger/,"🥩"],[/pork|tenderloin/,"🍖"],[/pasta|spaghetti|bolognese|lasagna/,"🍝"],
    [/taco|burrito|mexican/,"🌮"],[/soup|stew|chili/,"🍲"],[/salad/,"🥗"],
    [/pizza/,"🍕"],[/egg|frittata|omelette|scramble/,"🥚"],[/pancake|waffle/,"🥞"],
    [/smoothie/,"🥤"],[/oat|overnight/,"🫙"],[/wrap|lettuce/,"🥬"],
    [/meatball/,"🍝"],[/bowl/,"🥙"],[/sandwich/,"🥪"],
  ];
  for (const [re, emoji] of emojis) { if (re.test(n)) return emoji; }
  return "🍽️";
}

function showImportPreview(imported, total) {
  window._pendingPaprikaImport = imported;
  const rows = [
    imported.dinners.length ? `<div style="padding:8px 0;border-bottom:1px solid var(--border)"><span style="color:var(--green);font-weight:700">🍽️ Dinners (${imported.dinners.length})</span><div style="color:var(--muted);font-size:12px;margin-top:4px">${imported.dinners.slice(0,3).map(r=>r.name).join(", ")}${imported.dinners.length>3?" +more":""}</div></div>` : "",
    imported.lunches.length ? `<div style="padding:8px 0;border-bottom:1px solid var(--border)"><span style="color:var(--green);font-weight:700">🥗 Lunches (${imported.lunches.length})</span><div style="color:var(--muted);font-size:12px;margin-top:4px">${imported.lunches.slice(0,3).map(r=>r.name).join(", ")}${imported.lunches.length>3?" +more":""}</div></div>` : "",
    imported.breakfasts.length ? `<div style="padding:8px 0"><span style="color:var(--green);font-weight:700">⚡ Breakfasts (${imported.breakfasts.length})</span><div style="color:var(--muted);font-size:12px;margin-top:4px">${imported.breakfasts.slice(0,3).map(r=>r.name).join(", ")}${imported.breakfasts.length>3?" +more":""}</div></div>` : "",
  ].filter(Boolean).join("");

  const swapCount = [...imported.dinners,...imported.lunches,...imported.breakfasts]
    .filter(r => r.ingredients.some(i => i.includes("Mission Carb") || i.includes("Brami") || i.includes("0% Greek") || i.includes("reduced-fat") || i.includes("Fairlife"))).length;

  openModal(`
    <div class="modal-header">
      <div class="modal-title">🥘 Import from Paprika</div>
      <button class="modal-close" onclick="closeModalForce()">✕</button>
    </div>
    <div style="background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-size:15px;font-weight:700;color:var(--green);margin-bottom:4px">✅ Found ${total} recipe${total>1?"s":""}</div>
      ${imported.skipped ? `<div style="font-size:12px;color:var(--dim)">${imported.skipped} entries skipped (missing ingredients or steps)</div>` : ""}
    </div>
    ${rows}
    ${swapCount>0 ? `<div style="background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.15);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13px;color:var(--muted)">✅ Your swap library will be applied to ${swapCount} recipe${swapCount>1?"s":""} automatically.</div>` : ""}
    <div style="font-size:12px;color:var(--dim);margin:12px 0">These will be <strong style="color:var(--text)">added</strong> to your existing recipes — nothing will be replaced.</div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn-secondary" onclick="closeModalForce()">Cancel</button>
      <button style="flex:2;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#ff6b35,#f7421e);color:#fff;font-weight:700;font-size:14px;cursor:pointer" onclick="confirmPaprikaImport()">🥘 Import All Recipes</button>
    </div>
  `);
}

function confirmPaprikaImport() {
  const imported = window._pendingPaprikaImport;
  if (!imported) return;
  state.dinners    = [...state.dinners,    ...imported.dinners];
  state.lunches    = [...state.lunches,    ...imported.lunches];
  state.breakfasts = [...state.breakfasts, ...imported.breakfasts];
  window._pendingPaprikaImport = null;
  closeModalForce();
  scheduleSave();
  showTab("plan");
  showImportStatus("✅ Imported " + (imported.dinners.length + imported.lunches.length + imported.breakfasts.length) + " recipes from Paprika!");
}

function showImportStatus(msg) {
  const el = document.getElementById("paprika-import-status");
  if (el) { el.textContent = msg; el.style.display = "block"; }
}

async function init() {
  // Version check - clear old incompatible localStorage data
  try {
    var storedVersion = localStorage.getItem('lemmonPlannerVersion');
    if (storedVersion !== '2.0') {
      localStorage.removeItem('lemmonMealPlan_v1');
      localStorage.setItem('lemmonPlannerVersion', '2.0');
    }
  } catch(e) {}
  loadFromLocal();
  state.breakfasts = state.breakfasts.map(r => ({...r, ingredients: applySwaps(r.ingredients)}));
  state.lunches    = state.lunches.map(r => ({...r, ingredients: applySwaps(r.ingredients)}));
  state.dinners    = state.dinners.map(r => ({...r, ingredients: applySwaps(r.ingredients)}));

  var planEl = document.getElementById("page-plan");
  if (planEl) planEl.innerHTML = '<div style="padding:20px;color:#10b981">Loading...</div>';
  try {
    renderPlan();
  } catch(e) {
    var el2 = document.getElementById("page-plan");
    if (el2) el2.innerHTML = '<div style="padding:20px;color:#ef4444;font-size:14px;background:rgba(239,68,68,0.1);margin:16px;border-radius:12px;border:1px solid rgba(239,68,68,0.3);font-family:monospace"><strong>renderPlan error:</strong><br><br>' + (e.message||e) + '<br><br>' + (e.stack||'').substring(0,400) + '</div>';
  }
  if (state.supabaseUrl && state.supabaseKey) {
    try {
      var ok = await initSupabase();
      if (ok) {
        await loadFromSupabase();
        renderTab(currentTab);
      } else {
        setSyncStatus("offline");
      }
    } catch(e) {
      console.error("Supabase connection error:", e);
      setSyncStatus("offline");
    }
  } else {
    setSyncStatus("offline");
  }
  checkUrlImport();
}

function checkUrlImport() {
  const hash = window.location.hash; // e.g. #import=https://instagram.com/p/xxx
  if (!hash.startsWith("#import=")) return;
  const url = decodeURIComponent(hash.slice(8));
  if (!url) return;
  history.replaceState(null, "", window.location.pathname);
  setTimeout(() => {
    showImportModal("dinner", "url");
    setTimeout(() => {
      const el = document.getElementById("import-url");
      if (el) { el.value = url; el.focus(); }
    }, 150);
  }, 400);
}
window.addEventListener("hashchange", checkUrlImport);

init().catch(function(e) {
  var el = document.getElementById("page-plan");
  if (el) el.innerHTML = '<div style="padding:20px;color:#ef4444;font-size:13px;background:rgba(239,68,68,0.1);margin:16px;border-radius:12px;border:1px solid rgba(239,68,68,0.3)"><div style="font-weight:700;margin-bottom:8px">Debug Error:</div>' + (e && e.message ? e.message : String(e)) + '<br><br>' + (e && e.stack ? e.stack.substring(0,500) : '') + '</div>';
});
</script>
