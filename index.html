<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥗 Lemmon Family Meal Planner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#07090f;
  --bg2:#0d1117;
  --surface:rgba(255,255,255,0.04);
  --surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);
  --green:#10b981;
  --green-dim:rgba(16,185,129,0.1);
  --green-glow:rgba(16,185,129,0.2);
  --purple:#8b5cf6;
  --amber:#f59e0b;
  --pink:#ec4899;
  --indigo:#6366f1;
  --red:#ef4444;
  --text:#eef2f7;
  --text2:#c9d4e0;
  --muted:#8899aa;
  --dim:#4e6070;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow-sm:0 2px 8px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ── NAV ─────────────────────────────────────────────── */
nav{
  background:rgba(7,9,15,0.85);
  border-bottom:1px solid var(--border);
  padding:10px 16px 6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.nav-title{
  font-size:16px;
  font-weight:800;
  letter-spacing:-0.3px;
  color:var(--text);
}
.nav-sub{
  font-size:10px;
  color:var(--dim);
  margin-top:1px;
  letter-spacing:0.3px;
  text-transform:uppercase;
}
.nav-tabs{
  display:flex;
  gap:3px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.tab-btn{
  padding:5px 9px;
  border-radius:10px;
  border:none;
  background:transparent;
  color:var(--dim);
  font-weight:500;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  cursor:pointer;
  transition:all 0.15s ease;
  position:relative;
}
.tab-btn:hover{
  color:var(--muted);
  background:rgba(255,255,255,0.04);
}
.tab-btn.active{
  background:var(--green-dim);
  color:var(--green);
  font-weight:700;
}
.tab-btn.active::after{
  content:'';
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:2px;
  background:var(--green);
  border-radius:2px;
}
/* ── PAGES ───────────────────────────────────────────── */
.page{display:none;padding:16px;max-width:100%;margin:0;padding-bottom:80px;}
.page.active{display:block;}

/* ── CARDS ───────────────────────────────────────────── */
.card{
  background:linear-gradient(145deg,rgba(255,255,255,0.055),rgba(255,255,255,0.025));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:8px;
  transition:border-color 0.2s,box-shadow 0.2s;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
}
.card:hover{
  border-color:var(--border2);
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.card-row{display:flex;align-items:center;gap:12px;}
.card-emoji{font-size:26px;flex-shrink:0;}
.card-body{flex:1;min-width:0;}
.card-name{
  font-size:16px;
  font-weight:700;
  letter-spacing:-0.2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--text);
}
.card-desc{
  color:var(--muted);
  font-size:13px;
  margin:3px 0 8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.4;
}
.card-actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.card-actions button{
  padding:6px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition:all 0.15s;
}
.card-actions button:hover{background:var(--surface2);}
.card-actions .btn-edit{border-color:rgba(99,102,241,0.4);color:var(--indigo);}
.card-actions .btn-del{border-color:rgba(239,68,68,0.4);color:var(--red);}
/* ── DINNER CARDS ────────────────────────────────────── */
.dinner-card{
  background:linear-gradient(145deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:8px;
  overflow:hidden;
  transition:border-color 0.2s,box-shadow 0.2s;
  position:relative;
}
.dinner-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
  pointer-events:none;
}
.dinner-card:hover{border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.dinner-card .drag-handle{padding:0 10px;color:var(--dim);cursor:grab;font-size:18px;flex-shrink:0;user-select:none;}
.dinner-card .drag-handle:active{cursor:grabbing;}
.dinner-card.sortable-ghost{opacity:0.35;}
.dinner-card.sortable-chosen{border-color:var(--green);box-shadow:0 0 0 1px var(--green-glow);}

/* ── TAGS ────────────────────────────────────────────── */
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.tag{
  font-size:11px;
  font-weight:600;
  padding:2px 8px;
  border-radius:20px;
  letter-spacing:0.1px;
}
.tag-green{background:rgba(16,185,129,0.12);color:#10b981;border:1px solid rgba(16,185,129,0.2);}
.tag-indigo{background:rgba(99,102,241,0.1);color:#818cf8;border:1px solid rgba(99,102,241,0.2);}
.tag-amber{background:rgba(245,158,11,0.1);color:#fbbf24;border:1px solid rgba(245,158,11,0.2);}
.tag-muted{background:rgba(148,163,184,0.08);color:var(--muted);border:1px solid rgba(148,163,184,0.15);}
.tag-pink{background:rgba(236,72,153,0.1);color:#f472b6;border:1px solid rgba(236,72,153,0.2);}
.tag-purple{background:rgba(139,92,246,0.1);color:#a78bfa;border:1px solid rgba(139,92,246,0.2);}

/* ── MODAL ───────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:200;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.modal-box{
  background:#0d1117;
  border:1px solid var(--border2);
  border-radius:24px 24px 0 0;
  padding:20px 18px;
  max-height:88vh;
  overflow-y:auto;
  width:100%;
  max-width:600px;
  box-shadow:0 -8px 40px rgba(0,0,0,0.6);
  position:relative;
}
.modal-box::before{
  content:'';
  display:block;
  width:36px;height:4px;
  background:rgba(255,255,255,0.15);
  border-radius:2px;
  margin:0 auto 16px;
}
.modal-title{
  font-size:20px;
  font-weight:800;
  letter-spacing:-0.4px;
  margin-bottom:4px;
  color:var(--text);
}
.modal-close{
  position:absolute;
  top:16px;right:16px;
  background:rgba(255,255,255,0.08);
  border:none;
  color:var(--muted);
  width:28px;height:28px;
  border-radius:50%;
  font-size:14px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.15s;
}
.modal-close:hover{background:rgba(255,255,255,0.15);}

/* ── SECTION HEADERS ─────────────────────────────────── */
.section-header{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.8px;
  text-transform:uppercase;
  color:var(--dim);
  margin:20px 0 10px;
  display:flex;
  align-items:center;
  gap:8px;
}
.section-header::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--border);
}

/* ── INPUTS ──────────────────────────────────────────── */
input,textarea,select{
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  padding:10px 14px;
  width:100%;
  transition:border-color 0.15s,box-shadow 0.15s;
  outline:none;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px var(--green-dim);
}
input::placeholder,textarea::placeholder{color:var(--dim);}

/* ── BUTTONS ─────────────────────────────────────────── */
.btn-primary{
  background:linear-gradient(135deg,#10b981,#059669);
  color:#07090f;
  border:none;
  border-radius:var(--radius-sm);
  padding:11px 18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:opacity 0.15s,transform 0.1s;
}
.btn-primary:active{transform:scale(0.98);}
.btn-ghost{
  background:transparent;
  border:1px solid var(--border2);
  color:var(--muted);
  border-radius:var(--radius-sm);
  padding:10px 16px;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:background 0.15s,border-color 0.15s;
}
.btn-ghost:hover{background:var(--surface2);border-color:var(--border2);}

/* ── WEEK GRID ───────────────────────────────────────── */
.week-day-header{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.6px;
  text-transform:uppercase;
  color:var(--green);
  padding:12px 0 6px;
  border-bottom:1px solid var(--border);
  margin-bottom:8px;
}
.meal-slot{
  background:linear-gradient(145deg,rgba(255,255,255,0.04),rgba(255,255,255,0.015));
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:6px;
  overflow:hidden;
  transition:border-color 0.15s;
}
.meal-slot:hover{border-color:var(--border2);}
.meal-slot-header{
  font-size:10px;
  font-weight:700;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color:var(--dim);
  padding:6px 12px 0;
}
.meal-slot-content{padding:4px 12px 10px;}
.meal-recipe-name{
  font-size:14px;
  font-weight:600;
  color:var(--text);
  margin-bottom:4px;
}
.meal-recipe-meta{
  font-size:12px;
  color:var(--dim);
}
.meal-actions{display:flex;gap:6px;margin-top:6px;}
.meal-btn{
  padding:4px 10px;
  border-radius:6px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  transition:background 0.15s;
}
.meal-btn:hover{background:var(--surface2);}
.meal-btn-cook{border-color:rgba(16,185,129,0.3);color:var(--green);}

/* ── PANTRY ──────────────────────────────────────────── */
.pantry-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  background:linear-gradient(145deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:5px;
  transition:border-color 0.15s;
}
.pantry-item:hover{border-color:var(--border2);}
.pantry-status{
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}
.status-have{background:rgba(16,185,129,0.12);color:#10b981;border:1px solid rgba(16,185,129,0.2);}
.status-low{background:rgba(245,158,11,0.12);color:#fbbf24;border:1px solid rgba(245,158,11,0.2);}
.status-out{background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.2);}

/* ── GROCERY ─────────────────────────────────────────── */
.grocery-section-header{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.6px;
  text-transform:uppercase;
  color:var(--green);
  padding:14px 0 6px;
  display:flex;align-items:center;gap:8px;
}
.grocery-section-header::after{
  content:'';flex:1;height:1px;background:rgba(16,185,129,0.15);
}
.grocery-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 14px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:4px;
  font-size:14px;
  transition:background 0.15s;
}
.grocery-item:hover{background:rgba(255,255,255,0.05);}
.grocery-check{
  width:18px;height:18px;
  border-radius:5px;
  border:1.5px solid var(--border2);
  flex-shrink:0;
  cursor:pointer;
  transition:all 0.15s;
  display:flex;align-items:center;justify-content:center;
}
.grocery-check.checked{
  background:var(--green);
  border-color:var(--green);
  color:#07090f;
  font-size:11px;
}

/* ── COOK MODE ───────────────────────────────────────── */
.cook-step{
  background:linear-gradient(145deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:8px;
  transition:all 0.2s;
  position:relative;
  overflow:hidden;
}
.cook-step.active-step{
  border-color:var(--green);
  box-shadow:0 0 0 1px var(--green-glow);
}
.cook-step.active-step::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:var(--green);
  border-radius:3px 0 0 3px;
}
.cook-step.done-step{
  opacity:0.5;
}

/* ── RECIPE MODAL SECTIONS ───────────────────────────── */
.recipe-section-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:0.8px;
  text-transform:uppercase;
  color:var(--green);
  margin:14px 0 8px;
}
.ingredient-section{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color:var(--dim);
  padding:10px 0 4px;
}
.ingredient-item{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:5px 0;
  font-size:14px;
  color:var(--text2);
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.ingredient-bullet{
  color:var(--green);
  font-size:8px;
  margin-top:5px;
  flex-shrink:0;
}
.recipe-step-item{
  display:flex;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,0.04);
  font-size:14px;
  color:var(--text2);
  line-height:1.5;
}
.step-number{
  width:22px;height:22px;
  border-radius:50%;
  background:var(--green-dim);
  color:var(--green);
  font-size:11px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  margin-top:1px;
}
.tip-box{
  background:rgba(245,158,11,0.06);
  border:1px solid rgba(245,158,11,0.15);
  border-radius:10px;
  padding:10px 12px;
  margin-top:10px;
  font-size:13px;
  color:var(--text2);
  line-height:1.5;
}
.tip-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color:var(--amber);
  margin-bottom:4px;
}

/* ── INFO PILLS ──────────────────────────────────────── */
.info-pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  color:var(--muted);
}
.info-pill.protein{background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.2);color:var(--green);}
.info-pill.calories{background:rgba(245,158,11,0.08);border-color:rgba(245,158,11,0.2);color:var(--amber);}

/* ── SCROLL ──────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2);}

/* ── ANIMATIONS ──────────────────────────────────────── */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.page.active{animation:fadeIn 0.2s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.modal-box{animation:slideUp 0.25s ease;}

/* ── MISC ────────────────────────────────────────────── */
.surface{background:var(--surface);}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div>
    <div class="nav-title">🥗 Lemmon Family Meal Planner</div>
    <div class="sync-status offline" id="syncStatus">Dinners · Lunches · Grab-and-Go</div>
  </div>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="showTab('plan')" title="Plan"><span style="font-size:16px">📅</span><span style="font-size:9px;line-height:1">Plan</span></button>
    <button class="tab-btn" onclick="showTab('vault')" title="Recipe Vault"><span style="font-size:16px">🗄️</span><span style="font-size:9px;line-height:1">Vault</span></button>
    <button class="tab-btn" onclick="showTab('grocery')" title="Grocery"><span style="font-size:16px">🛒</span><span style="font-size:9px;line-height:1">Shop</span></button>
    <button class="tab-btn" onclick="showTab('sauces')" title="Sauces"><span style="font-size:16px">🫙</span><span style="font-size:9px;line-height:1">Sauces</span></button>
    <button class="tab-btn" onclick="showTab('pantry')" title="Pantry"><span style="font-size:16px">🧄</span><span style="font-size:9px;line-height:1">Pantry</span></button>
    <button class="tab-btn" onclick="showTab('history')" title="History"><span style="font-size:16px">📖</span><span style="font-size:9px;line-height:1">History</span></button>
    <button class="tab-btn" onclick="showTab('prep')" title="Prep Order"><span style="font-size:16px">🔪</span><span style="font-size:9px;line-height:1">Prep</span></button>
    <button class="tab-btn" onclick="showTab('eatout')" title="Eat Out"><span style="font-size:16px">🍔</span><span style="font-size:9px;line-height:1">Eat Out</span></button>
    <button class="tab-btn" onclick="showTab('settings')" title="Settings"><span style="font-size:16px">⚙️</span><span style="font-size:9px;line-height:1">More</span></button>
    <button class="tab-btn" onclick="showTab('cook')" style="background:linear-gradient(135deg,#10b981,#059669);color:#0a0f1a;font-weight:700">👨‍🍳 Cook</button>
  </div>
</nav>

<!-- PAGES -->
<div id="pull-indicator" style="position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(16,185,129,0.9);color:#0a0f1a;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none">↓ Pull to sync</div>
<div id="page-plan" class="page active"></div>
<div id="page-vault" class="page"></div>
<div id="page-grocery" class="page"></div>
<div id="page-swaps" class="page"></div>
<div id="page-kids" class="page"></div>
<div id="page-settings" class="page"></div>
<div id="page-pantry" class="page"></div>
<div id="page-sauces" class="page"></div>
<div id="page-history" class="page"></div>
<div id="page-nutrition" class="page"></div>
<div id="page-prep" class="page"></div>
<div id="page-eatout" class="page"></div>
<div id="cook-overlay" style="display:none;position:fixed;inset:0;z-index:500;background:#0a0f1a;flex-direction:column;overflow-y:auto;">
  <div style="position:sticky;top:0;z-index:10;background:#0a0f1a;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:12px">
    <button onclick="closeCookMode()" style="padding:6px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:var(--muted);font-size:14px;cursor:pointer">← Back</button>

async function initSupabase() {
  if (!state.supabaseUrl || !state.supabaseKey) return false;
  try {
    var mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    var createClient = mod.createClient;
    if (!createClient) throw new Error("createClient not found");
    supabase = createClient(state.supabaseUrl, state.supabaseKey);
    return true;
  } catch(e) {
    console.error("Supabase init failed:", e);
    supabase = null;
    return false;
  }
}


function applySwaps(ingredients) {
  if (!ingredients || !Array.isArray(ingredients) || !ingredients.length) return [];
  return ingredients.map(ing => {
    if (typeof ing !== "string") return ing;
    let result = ing;
    const SWAP_RULES = [
      { match: /\bwhite rice\b|\brown rice\b/i, replace: () => "cauliflower rice (or farro/quinoa for more protein)" },
      { match: /\bregular pasta\b|\bspaghetti\b|\bpenne\b|\brigatoni\b|\bfettuccine\b|\bfarfalle\b|\blinguine\b/i, replace: (m) => `Brami protein pasta or Barilla Protein+ (use instead of ${m})` },
      { match: /\bwhole milk\b/i, replace: () => "Fairlife 2% milk (50% more protein)" },
      { match: /\bsour cream\b/i, replace: () => "Fage 0% Greek yogurt (same texture, more protein)" },
      { match: /\bheavy cream\b/i, replace: () => "Fairlife 2% milk or blended cottage cheese" },
      { match: /\bcottage cheese\b/i, replace: () => "Good Culture 4% cottage cheese" },
      { match: /\bGreek yogurt\b/i, replace: () => "Fage 0% Greek yogurt" },
      { match: /\bregular butter\b/i, replace: () => "Land O'Lakes light butter" },
      { match: /\bvegetable oil\b|\bcanola oil\b/i, replace: () => "refined avocado oil" },
      { match: /\bsoy sauce\b/i, replace: () => "reduced-sodium soy sauce or coconut aminos" },
      { match: /\bground beef\b/i, replace: () => "Jennie-O 93/7 ground turkey" },
      { match: /\bregular bacon\b/i, replace: () => "Wellshire Farms turkey bacon — sub: Butterball or Jennie-O turkey bacon (Kroger/Publix)" },
      { match: /\bpork sausage\b/i, replace: () => "Amylu chicken breakfast sausage (Costco)" },
    ];
    for (const rule of SWAP_RULES) {
      if (rule.match.test(result)) {
        result = result.replace(rule.match, rule.replace);
        break;
      }
    }
    return result;
  });
}

async function loadFromSupabase() {
  if (!supabase) return;
  try {
    setSyncStatus("loading");
    const { data, error } = await supabase.from("meal_plan").select("*").eq("id", "family").single();
    if (error) {
      if (error.code === "PGRST116") await saveToSupabase(); // no row yet, create it
      return;
    }
    if (data && data.plan) {
      const plan = data.plan;
      const safeMap = (arr) => (arr || []).filter(r => r && r.id).map(r => ({...r, ingredients: applySwaps(r.ingredients || []), instructions: r.instructions || [], tips: r.tips || ""}));
      if (plan.breakfasts) state.breakfasts = safeMap(plan.breakfasts);
      if (plan.lunches)    state.lunches    = safeMap(plan.lunches);
      if (plan.dinners)    state.dinners    = safeMap(plan.dinners);
      if (plan.desserts)   state.desserts   = safeMap(plan.desserts);
      if (plan.swaps)      state.swaps      = plan.swaps;
      if (plan.spiceBlends) state.spiceBlends = plan.spiceBlends;
      if (plan.userEmail)  state.userEmail  = plan.userEmail;
      if (plan.wifeEmail)  state.wifeEmail  = plan.wifeEmail;
      if (plan.store)      state.store      = plan.store;
      if (plan.grocery)    state.grocery    = plan.grocery;
        if (plan.useStaticGrocery !== undefined) state.useStaticGrocery = plan.useStaticGrocery;
        if (plan.pantry) state.pantry = plan.pantry;
        if (plan.alexaOnlyItems) state.alexaOnlyItems = plan.alexaOnlyItems;
        if (plan.alexaSyncTime) state.alexaSyncTime = plan.alexaSyncTime;
        if (plan.ratings) state.ratings = plan.ratings;
        if (plan.activeRecipes) state.activeRecipes = plan.activeRecipes;
        if (plan.sauces) state.sauces = plan.sauces;
        if (plan.weekPlan) state.weekPlan = plan.weekPlan;
        if (plan.cookHistory) state.cookHistory = plan.cookHistory;
        if (plan.groceryNotes) state.groceryNotes = plan.groceryNotes;
      setSyncStatus("saved");
    }
  } catch(e) { console.error("Load error:", e); setSyncStatus("offline"); }
}

async function saveToSupabase() {
  if (!supabase) { saveToLocal(); return; }
  setSyncStatus("saving");
  try {
    const plan = { breakfasts: state.breakfasts, lunches: state.lunches, dinners: state.dinners, desserts: state.desserts, swaps: state.swaps, spiceBlends: state.spiceBlends, userEmail: state.userEmail, wifeEmail: state.wifeEmail, store: state.store, grocery: state.grocery, useStaticGrocery: state.useStaticGrocery, pantry: state.pantry, alexaOnlyItems: state.alexaOnlyItems, alexaSyncTime: state.alexaSyncTime, ratings: state.ratings, activeRecipes: state.activeRecipes, sauces: state.sauces, weekPlan: state.weekPlan, cookHistory: state.cookHistory, groceryNotes: state.groceryNotes };
    await supabase.from("meal_plan").upsert({ id: "family", plan, updated_at: new Date().toISOString() });
    saveToLocal();
    setSyncStatus("saved");
  } catch(e) { console.error("Save error:", e); setSyncStatus("offline"); saveToLocal(); }
}

function tags(item) {
  const t = [];
  if (item.calories) t.push(`<span class="tag tag-green">${item.calories} cal</span>`);
  if (item.protein)  t.push(`<span class="tag tag-indigo">${item.protein}g protein</span>`);
  if (item.activeTime) t.push(`<span class="tag tag-amber">⏱ ${esc(item.activeTime)}</span>`);
  if (item.serves)   t.push(`<span class="tag tag-muted">${esc(item.serves)}</span>`);
  if (item.kidFriendly) t.push(`<span class="tag tag-pink">👧 Kid-friendly</span>`);
  if (item.prepNote) t.push(`<span class="tag tag-green">📦 Prep-ahead</span>`);
  if (item.hiddenVeg) t.push(`<span class="tag tag-purple">🥦 Hidden veg</span>`);
  const r = (state.ratings||{})[item.id];
  if (r&&r.stars) {
    const stars = "⭐".repeat(r.stars) + (r.stars < 5 ? "☆".repeat(5-r.stars) : "");
    t.push(`<span class="tag tag-amber" title="${r.note||""}">${stars}</span>`);
  }
  return t.join("");
}

  const activeRecipes = [

  // Build a clear summary for Claude
  const lines = [];
  lines.push("Here are my active recipes this week and their ingredients. Please add everything to my Instacart cart at " + state.store + ":");

  activeRecipes.forEach(r => {
    lines.push("## " + r.name);
    (r.ingredients || []).forEach(ing => {
      if (!ing.startsWith("---") && !ing.startsWith("Option ")) {
        lines.push("- " + ing);

  // Add any Alexa items

  const scale = scaleFactors[item.id] || 1;

    return ing.replace(/(\d+(\.\d+)?)/g, (m) => {

    return `<div class="ingredient-item"><span class="ingredient-bullet">●</span><span>${esc(scale===1?ing:scaleIngr(ing))}</span></div>`;

  const stepsHtml = (item.instructions || []).map((s,i) =>

    </div>
    <div class="scale-row">
      <span style="font-size:12px;color:var(--muted);font-weight:600">Servings:</span>
      <button class="scale-btn" onclick="changeScale('${item.id}','${section}',-1)">−</button>
      <div class="scale-display">${scale}× <span style="color:var(--dim);font-size:11px">(${Math.round((parseInt(item.serves)||4)*scale)} servings)</span></div>
      <button class="scale-btn" onclick="changeScale('${item.id}','${section}',1)">+</button>
    </div>
    ${notesHtml}
    <div class="recipe-tabs">
      <button class="recipe-tab active" id="rtab-ing" onclick="switchRecipeTab('ing')">Ingredients</button>
      <button class="recipe-tab" id="rtab-steps" onclick="switchRecipeTab('steps')">Instructions</button>
    </div>
    <div id="rcontent-ing">${ingrHtml}</div>
    <div id="rcontent-steps" style="display:none">${stepsHtml}</div>
    ${buildRatingHtml(item.id, section)}
    <div style="display:flex;gap:8px;margin-top:16px;border-top:1px solid var(--border);padding-top:12px">
      <button style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--indigo);background:transparent;color:var(--indigo);font-weight:600;font-size:13px;cursor:pointer" onclick="closeModalForce();editItem('${section}','${id}')">✏️ Edit</button>
      <button style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--red);background:transparent;color:var(--red);font-weight:600;font-size:13px;cursor:pointer" onclick="deleteItem('${section}','${id}')">🗑 Remove</button>
    </div>
  `);
}

function changeScale(id, section, delta) {
  const cur = scaleFactors[id] || 1;
  const next = Math.max(0.5, Math.min(4, cur + delta * 0.5));
  scaleFactors[id] = Math.round(next * 2) / 2; // snap to 0.5 increments
  viewRecipe(section, id); // re-render modal with new scale
}

function switchRecipeTab(t) {
  document.getElementById("rtab-ing").classList.toggle("active", t==="ing");
  document.getElementById("rtab-steps").classList.toggle("active", t==="steps");
  document.getElementById("rcontent-ing").style.display = t==="ing" ? "" : "none";
  document.getElementById("rcontent-steps").style.display = t==="steps" ? "" : "none";
}

function deleteItem(section, id) {
  if (!confirm("Remove this recipe?")) return;
  const setter = s => { if (section==="breakfast") state.breakfasts=s; else if (section==="lunch") state.lunches=s; else if (section==="dessert") state.desserts=s; else state.dinners=s; };
  const list = section==="breakfast" ? state.breakfasts : section==="lunch" ? state.lunches : section==="dessert" ? state.desserts : state.dinners;
  setter(list.filter(x => x.id !== id));
  closeModalForce();
  scheduleSave();
  renderTab(currentTab);
}

function editItem(section, id) {
  const list = section==="breakfast" ? state.breakfasts : section==="lunch" ? state.lunches : state.dinners;
  const item = list.find(x => x.id === id) || { id: "", emoji:"🍽️", day: DAYS[0] };
  showEditModal(section, item);
}

  const item = {
    id:           f("ef-id") || uid(),
    name:         f("ef-name"),
    emoji:        f("ef-emoji") || "🍽️",

    protein:      Number(f("ef-prot")) || 0,
    activeTime:   f("ef-active"),
    totalTime:    f("ef-total"),

    instructions: f("ef-steps").split("\n").map(s=>s.trim()).filter(Boolean),
  };

  const exists = list.find(x => x.id === item.id);

}

async function parseImportCaption(section) {
  const text = (document.getElementById("import-text")||{}).value.trim();
  if (!text) { alert("Please paste some recipe text first."); return; }
  await runImportParser(section, { type: "text", content: text });
}

async function parseImportUrl(section) {
  const url = (document.getElementById("import-url")||{}).value.trim();
  if (!url) { alert("Please enter a URL first."); return; }
  await runImportParser(section, { type: "url", content: url });
}

async function parseImportPhoto(section, input) {
  const file = (input&&input.files&&input.files[0]);
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(",")[1];
    const mimeType = file.type || "image/jpeg";
    await runImportParser(section, { type: "image", base64, mimeType });
  };
  reader.readAsDataURL(file);
}

async function parseImport(section) {
  const text = (document.getElementById("import-text")||{}).value.trim();
  if (!text) return;
  await runImportParser(section, { type: "text", content: text });
}

async function runImportParser(section, input) {
  const loadingEmoji = input.type === "url" ? "🔗" : input.type === "image" ? "📸" : "📲";
  const loadingMsg  = input.type === "url" ? "Fetching recipe from URL..." : input.type === "image" ? "Reading recipe from photo..." : "Parsing recipe text...";

  document.getElementById("modalBox").innerHTML = `
    <div style="text-align:center;padding:50px 20px">
      <div style="font-size:44px;margin-bottom:16px">${loadingEmoji}</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:8px">${loadingMsg}</div>
      <div style="color:var(--dim);font-size:13px">Extracting ingredients, steps and estimating macros</div>
    </div>`;

  const dayHint = section==="dinner" ? '"day":"Monday",' : "";
  let messageContent;
  if (input.type === "image") {
    messageContent = [
      { type: "image", source: { type: "base64", media_type: input.mimeType, data: input.base64 }},
      { type: "text", text: "Extract the complete recipe from this image. Parse all ingredients and instructions you can see." }
    ];
  } else if (input.type === "url") {
    messageContent = `Fetch and parse the recipe at this URL: ${input.content}\n\nIf it's an Instagram URL, extract the recipe from the post caption. If it's a recipe website, extract the full recipe. Use web_search if needed to find the content.`;
  } else {
    messageContent = "Parse this recipe:\n\n" + input.content;
  }

  try {
    const tools = input.type === "url" ? [{ type: "web_search_20250305", name: "web_search" }] : undefined;
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json","anthropic-beta":"claude-ai-artifact-preview","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:1500,
        ...(tools ? { tools } : {}),
        system:`You are a recipe parser. Return ONLY a raw JSON object, no markdown. Format: {"name":"...","emoji":"🍽️","description":"one sentence","calories":500,"protein":40,"activeTime":"15 min","totalTime":"30 min","serves":"4 servings",${dayHint}"kidFriendly":false,"prepNote":"","ingredients":["..."],"instructions":["..."],"tips":"one tip","sourceUrl":"if URL provided"} Estimate calories/protein for family of 4 if not stated. For URL inputs, fetch the page content and extract the full recipe.`,
        messages:[{role:"user", content: messageContent}]
      })
    });
    const data = await res.json();
    const raw = (data.content||[]).find(b=>b.type==="text").text||"";
    const match = raw.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);
    if (!match) throw new Error("Could not parse");
    const recipe = JSON.parse(match[0]);
    const swapped = applySwaps(recipe.ingredients||[]);
    const diff = getSwapDiff(recipe.ingredients||[], swapped);
    recipe.ingredients = swapped;
    recipe.id = uid();

    const diffHtml = diff.length ? `
      <div class="info-box green" style="margin-bottom:12px">
        <span style="color:var(--green);font-weight:700">✅ ${diff.length} auto-swap${diff.length>1?"s":""} applied</span>
        ${diff.map(s=>`<div style="font-size:12px;margin-top:4px;display:flex;gap:6px"><span style="color:var(--red);text-decoration:line-through">${esc(s.from)}</span><span style="color:var(--green)">→</span><span>${esc(s.to)}</span></div>`).join("")}
      </div>` : "";

    const ingrPreview = (recipe.ingredients||[]).slice(0,6).map(i=>`<div class="ingredient-item"><span class="ingredient-bullet">●</span><span>${esc(i)}</span></div>`).join("")
      + ((recipe.ingredients||[]).length>6 ? `<div style="color:var(--dim);font-size:12px;padding-top:4px">+${recipe.ingredients.length-6} more...</div>` : "");

    const previewData = btoa(unescape(encodeURIComponent(JSON.stringify(recipe))));
    document.getElementById("modalBox").innerHTML = `
      <div class="modal-header">
        <div>
          <div style="font-size:28px">${recipe.emoji}</div>
          <div class="modal-title" style="margin-top:4px">${esc(recipe.name)}</div>
          <div class="tags" style="margin-top:6px">${tags(recipe)}</div>
        </div>
        <button class="modal-close" onclick="closeModalForce()">✕</button>
      </div>
      ${diffHtml}
      ${ingrPreview}
      <div style="color:var(--dim);font-size:12px;margin:12px 0">💡 Macros estimated — edit anytime after adding.</div>
      <div style="display:flex;gap:8px">
        <button class="btn-secondary" onclick="showImportModal('${section}','caption')">← Back</button>
        <button style="flex:2;padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:700;font-size:14px;cursor:pointer" onclick="confirmImport('${section}','${previewData}')">✅ Add to ${section==="dinner"?"Dinners":section==="lunch"?"Lunches":"Breakfasts"}</button>
      </div>`;
  } catch(e) {
    document.getElementById("modalBox").innerHTML = `
      <div style="text-align:center;padding:40px 20px">
        <div style="font-size:36px;margin-bottom:12px">😕</div>
        <div style="color:var(--red);font-size:14px;margin-bottom:20px">${esc(e.message)}</div>
        <button class="btn-secondary" style="display:inline-block;width:auto;padding:10px 24px" onclick="showImportModal('${section}','caption')">← Try Again</button>
      </div>`;
  }
}

function confirmImport(section, encoded) {
  const recipe = JSON.parse(decodeURIComponent(escape(atob(encoded))));
  const setter = s => { if (section==="breakfast") state.breakfasts=s; else if (section==="lunch") state.lunches=s; else if (section==="dessert") state.desserts=s; else state.dinners=s; };
  const list = section==="breakfast" ? state.breakfasts : section==="lunch" ? state.lunches : section==="dessert" ? state.desserts : state.dinners;
  setter([...list, recipe]);
  closeModalForce();
  scheduleSave();
  renderTab(currentTab);
}

// ── AUTO WEEK PLANNER ────────────────────────────────────────────────────────
function autoplanWeek(numDinners, numBreakfasts, numLunches) {
  numDinners = numDinners || 3;
  numBreakfasts = (numBreakfasts !== undefined) ? numBreakfasts : 3;
  numLunches = (numLunches !== undefined) ? numLunches : 2;
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  const dinners = (state.dinners||[]).filter(r => r && r.id);
  const breakfasts = (state.breakfasts||[]).filter(r => r && r.id);
  const lunches = (state.lunches||[]).filter(r => r && r.id);

  // ── LEFTOVER CHAINS ──────────────────────────────────────────────────────
  // Define which recipes produce leftovers that feed other recipes
  // Format: { source: recipeId, feeds: [recipeId, ...], feedsOn: dayOffset }
  const LEFTOVER_CHAINS = [
    // Sheet Pan Chicken Sunday → Lettuce Cups Tuesday + Grain Bowls Wednesday
    {
      source: "dinner1",   // Sheet Pan Roast Chicken
      feeds: ["dinner2", "lunch2"], // Lettuce Cups, Grain Bowls
      note: "Sunday chicken → Tuesday Lettuce Cups + Wednesday Grain Bowls"
    },
    // Slow Cooker Chicken Tacos → Burrito Bowls next day
    {
      source: "dinner5",   // Slow Cooker Chicken Tacos
      feeds: ["dinner6"],  // Chicken Burrito Bowls
      note: "Taco chicken → Burrito Bowls next day"
    },
    // Reverse Sear Beef Tenderloin → French Dip next day
    {
      source: "dinner10",  // Beef Tenderloin
      feeds: [],
      note: "Tenderloin leftovers → French Dip sandwiches (built into recipe)"
    },
    // Turkey Bolognese → great as leftovers all week
    {
      source: "dinner3",   // Turkey Bolognese
      feeds: [],
      note: "Bolognese keeps 5 days — intentional leftovers"
    },
    // Turkey Chili → great all week
    {
      source: "dinner9",   // Slow Cooker Turkey Chili
      feeds: [],
      note: "Chili keeps 5 days — intentional leftovers, freezes"
    },
  ];

  function scoreRecipe(r) {
    let score = 50; // base score
    const rating = (state.ratings[r.id]||{}).stars||0;
    score += rating * 12;
    if ((state.ratings[r.id]||{}).favorite) score += 25;
    const timesCooked = (state.cookHistory||[]).filter(h=>h.recipeId===r.id).length;
    if (timesCooked > 0) score += 8;
    score += Math.random() * 10; // slight randomization for variety
    // Penalize if made recently
    const recentCooks = (state.cookHistory||[]).filter(h=>h.recipeId===r.id);
    if (recentCooks.length) {
      const daysSince = Math.floor((Date.now() - new Date(recentCooks[0].date).getTime()) / 86400000);
      if (daysSince < 7)  score -= 40;
      else if (daysSince < 14) score -= 20;
    }
    return score;
  }

  // ── BUILD THE WEEK ────────────────────────────────────────────────────────
  const rankedDinners = [...dinners].sort((a,b) => scoreRecipe(b) - scoreRecipe(a));
  const newPlan = {};
  const usedTypes = new Set();
  const selectedDinners = [];

  // First pass: try to include a leftover chain recipe if scoring well
  const chainSources = LEFTOVER_CHAINS.map(c => c.source);
  const topChainRecipe = rankedDinners.find(r => chainSources.includes(r.id));
  if (topChainRecipe && numDinners >= 2) {
    selectedDinners.push(topChainRecipe);
    const isSlowCooker = topChainRecipe.name && topChainRecipe.name.toLowerCase().includes("slow cooker");
    if (isSlowCooker) usedTypes.add("slowcooker");
  }

  // Fill remaining slots with variety
  for (const r of rankedDinners) {
    if (selectedDinners.length >= numDinners) break;
    if (selectedDinners.find(s => s.id === r.id)) continue; // already selected

    // Variety constraints
    const isSlowCooker = r.name && r.name.toLowerCase().includes("slow cooker");
    if (isSlowCooker && usedTypes.has("slowcooker")) continue;
    if (isSlowCooker) usedTypes.add("slowcooker");

    const isSalmon = r.name && r.name.toLowerCase().includes("salmon");
    if (isSalmon && usedTypes.has("salmon")) continue;
    if (isSalmon) usedTypes.add("salmon");

    const isBurger = r.name && r.name.toLowerCase().includes("burger");
    if (isBurger && usedTypes.has("burger")) continue;
    if (isBurger) usedTypes.add("burger");

    const isTaco = r.name && (r.name.toLowerCase().includes("taco") || r.name.toLowerCase().includes("fajita"));
    if (isTaco && usedTypes.has("taco")) continue;
    if (isTaco) usedTypes.add("taco");

    selectedDinners.push(r);
  }

  // ── ASSIGN TO DAYS ────────────────────────────────────────────────────────
  // Smart day assignment based on recipe type
  // Slow cooker → Sunday or Monday (morning dump)
  // Special occasion (tenderloin, short ribs, smash burgers) → Friday or Saturday
  // Quick weeknight → Mon/Tue/Wed/Thu
  // Sheet pan chicken → Sunday (to create leftovers for the week)

  const daySlots = numDinners === 3 ? ["Sunday","Tuesday","Thursday"] :
                   numDinners === 4 ? ["Sunday","Tuesday","Thursday","Saturday"] :
                   numDinners === 5 ? ["Sunday","Monday","Wednesday","Thursday","Saturday"] :
                   numDinners === 7 ? DAYS : DAYS.slice(0, numDinners);

  // Try to put sheet pan chicken on Sunday, slow cooker on Sunday/Monday
  const sortedForDays = [...selectedDinners].sort((a,b) => {
    const aIsAnchor = a.id === "dinner1" || (a.name && a.name.toLowerCase().includes("slow cooker"));
    const bIsAnchor = b.id === "dinner1" || (b.name && b.name.toLowerCase().includes("slow cooker"));
    const aIsSpecial = a.name && (a.name.toLowerCase().includes("tenderloin") || a.name.toLowerCase().includes("short rib") || a.name.toLowerCase().includes("burger") || a.name.toLowerCase().includes("french onion"));
    const bIsSpecial = b.name && (b.name.toLowerCase().includes("tenderloin") || b.name.toLowerCase().includes("short rib") || b.name.toLowerCase().includes("burger") || b.name.toLowerCase().includes("french onion"));
    if (aIsAnchor && !bIsAnchor) return -1;
    if (bIsAnchor && !aIsAnchor) return 1;
    if (aIsSpecial && !bIsSpecial) return 1; // specials go later in week
    if (bIsSpecial && !aIsSpecial) return -1;
    return 0;
  });

  sortedForDays.forEach((r, i) => {
    if (daySlots[i]) {
      newPlan[daySlots[i] + "_dinner"] = { recipeId: r.id, section: "dinner" };
    }
  });

  // ── ADD BREAKFASTS ─────────────────────────────────────────────────────────
  if (numBreakfasts > 0) {
    const rankedBreakfasts = [...breakfasts].sort((a,b) => scoreRecipe(b) - scoreRecipe(a));

    // Identify batch/grab-and-go breakfast (for weekdays) vs family/weekend breakfast
    const batchBreakfast = rankedBreakfasts.find(r => r.name && (
      r.name.toLowerCase().includes("muffin") ||
      r.name.toLowerCase().includes("overnight") ||
      r.name.toLowerCase().includes("batch") ||
      (r.tags && r.tags.includes("prep-ahead"))
    )) || rankedBreakfasts[0];

    const familyBreakfast = rankedBreakfasts.find(r => r.id !== (batchBreakfast||{}).id && r.name && (
      r.name.toLowerCase().includes("pancake") ||
      r.name.toLowerCase().includes("waffle") ||
      r.name.toLowerCase().includes("french toast") ||
      r.name.toLowerCase().includes("scramble") ||
      r.name.toLowerCase().includes("shakshuka")
    )) || rankedBreakfasts.find(r => r.id !== (batchBreakfast||{}).id);

    if (numBreakfasts === 1 && batchBreakfast) {
      // Just one — batch cook Sunday, eat all week
      newPlan["Sunday_breakfast"] = { recipeId: batchBreakfast.id, section: "breakfast" };
    } else if (numBreakfasts >= 2) {
      // Batch breakfast on Sunday — make during Sunday prep, grab all week
      if (batchBreakfast) {
        newPlan["Sunday_breakfast"] = { recipeId: batchBreakfast.id, section: "breakfast" };
      }
      // Family breakfast on Saturday morning — sit down together
      const weekendBreakfast = familyBreakfast || batchBreakfast;
      if (weekendBreakfast) {
        newPlan["Saturday_breakfast"] = { recipeId: weekendBreakfast.id, section: "breakfast" };
      }
      // If more than 2, add batch to weekdays too
      if (numBreakfasts > 2 && batchBreakfast) {
        const extraDays = ["Monday","Wednesday","Friday","Tuesday","Thursday"].slice(0, numBreakfasts - 2);
        extraDays.forEach(d => {
          if (!newPlan[d + "_breakfast"]) {
            newPlan[d + "_breakfast"] = { recipeId: batchBreakfast.id, section: "breakfast" };
          }
        });
      }
    }
  }

  // ── ADD LUNCHES ─────────────────────────────────────────────────────────────
  if (numLunches > 0) {
    const topLunch = [...lunches].sort((a,b) => scoreRecipe(b) - scoreRecipe(a))[0];
    if (topLunch) {
      const lunchDays = ["Tuesday","Wednesday","Thursday","Friday","Saturday"].slice(0, numLunches);
      lunchDays.forEach(d => {
        if (!newPlan[d + "_lunch"]) {
          newPlan[d + "_lunch"] = { recipeId: topLunch.id, section: "lunch" };
        }
      });
    }
  }

  state.weekPlan = newPlan;
  scheduleSave();
  renderPlan();

  // Show leftover chain tip if relevant
  const chainUsed = LEFTOVER_CHAINS.find(c => selectedDinners.find(r => r.id === c.source) && c.note);
  if (chainUsed) {
    setTimeout(() => {
      const tip = document.createElement("div");
      tip.style.cssText = "position:fixed;bottom:80px;left:16px;right:16px;background:rgba(16,185,129,0.9);color:#0a0f1a;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;text-align:center";
      tip.textContent = "🔄 " + chainUsed.note;
      document.body.appendChild(tip);
      setTimeout(() => tip.remove(), 4000);
    }, 300);
  }
}

let currentDayPickerDay = "";


function openDaySlotPicker(day, slotKey) {
  currentDayPickerDay = day;
  currentDayPickerSlot = slotKey;
  const modal = document.getElementById("day-picker-modal");
  const title = document.getElementById("day-picker-title");
  const search = document.getElementById("day-picker-search");
  if (!modal) return;
  if (title) title.textContent = "Pick a " + slotKey + " for " + day;
  if (search) search.value = "";
  modal.style.display = "flex";
  filterDayPicker("", slotKey);
}

function removeDaySlot(day, slotKey) {
  const key = day + "_" + slotKey;
  delete state.weekPlan[key];
  // Also remove old-style key
  if (state.weekPlan[day] && state.weekPlan[day].section === slotKey) {
    delete state.weekPlan[day];
  }
  scheduleSave();
  renderPlan();
}

function openDayPicker(day) {
  currentDayPickerDay = day;
  const modal = document.getElementById("day-picker-modal");
  const title = document.getElementById("day-picker-title");
  const search = document.getElementById("day-picker-search");
  if (!modal) return;
  if (title) title.textContent = "Pick a recipe for " + day;
  if (search) search.value = "";
  modal.style.display = "flex";
  filterDayPicker("");
}

function closeDayPicker() {
  const modal = document.getElementById("day-picker-modal");
  if (modal) modal.style.display = "none";
  currentDayPickerDay = "";
}

function filterDayPicker(query) {
  const list = document.getElementById("day-picker-list");
  if (!list) return;
  const allRecipes = [...state.dinners,...state.breakfasts,...state.lunches,...state.desserts].filter(r=>r&&r.id);
  const q = query.toLowerCase();
  const filtered = q ? allRecipes.filter(r => r.name && r.name.toLowerCase().includes(q)) : allRecipes;

  // Group by type
  const dinners = filtered.filter(r => state.dinners.some(d => d.id === r.id));
  const breakfasts = filtered.filter(r => state.breakfasts.some(d => d.id === r.id));
  const lunches = filtered.filter(r => state.lunches.some(d => d.id === r.id));

  function recipeBtn(r) {
    const assigned = Object.entries(state.weekPlan||{}).find(([d,a]) => a && a.recipeId === r.id);
    return `<div onclick="assignFromPicker('${r.id}')"
      style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;margin-bottom:6px;background:rgba(255,255,255,0.04);border:1px solid ${assigned?"rgba(16,185,129,0.3)":"rgba(255,255,255,0.06)"};cursor:pointer">
      <span style="font-size:22px">${r.emoji||"🍽️"}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600;color:var(--text)">${esc(r.name)}</div>
        <div style="font-size:12px;color:var(--dim)">${r.calories||""}cal · ${r.protein||""}g protein${assigned?" · ✅ "+assigned[0]:""}</div>
      </div>
    </div>`;
  }

  let html = "";
  if (dinners.length) html += `<div style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin:8px 0 6px">Dinners</div>` + dinners.map(recipeBtn).join("");
  if (breakfasts.length) html += `<div style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin:8px 0 6px">Breakfasts</div>` + breakfasts.map(recipeBtn).join("");
  if (lunches.length) html += `<div style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin:8px 0 6px">Lunches</div>` + lunches.map(recipeBtn).join("");
  if (!html) html = `<div style="color:var(--dim);text-align:center;padding:20px">No recipes found</div>`;
  list.innerHTML = html;
}

function assignFromPicker(recipeId) {
  if (!currentDayPickerDay) return;
  const allRecipes = [...state.dinners,...state.breakfasts,...state.lunches,...state.desserts].filter(r=>r&&r.id);
  const recipe = allRecipes.find(r => r.id === recipeId);
  const section = state.dinners.some(r=>r.id===recipeId) ? "dinner" : state.breakfasts.some(r=>r.id===recipeId) ? "breakfast" : "lunch";
  state.weekPlan[currentDayPickerDay] = { recipeId, section };
  scheduleSave();
  closeDayPicker();
  renderPlan();
}

function showCookMode(recipeId) {
  const allRecipes = [...state.dinners,...state.breakfasts,...state.lunches,...state.desserts].filter(r=>r&&r.id);
  const recipe = allRecipes.find(r => r.id === recipeId);
  if (!recipe) return;
  const section = state.dinners.some(r=>r.id===recipeId) ? "dinner" : state.breakfasts.some(r=>r.id===recipeId) ? "breakfast" : "lunch";
  startCooking(section, recipeId);
}

function viewRecipeById(recipeId) {
  const section = state.dinners.some(r=>r&&r.id===recipeId) ? "dinner" : state.breakfasts.some(r=>r&&r.id===recipeId) ? "breakfast" : state.lunches.some(r=>r&&r.id===recipeId) ? "lunch" : "dessert";
  viewRecipe(section, recipeId);
}

function renderVault() {
  const el = document.getElementById("page-vault");
  if (!el) return;

  const allRecipes = [...state.dinners,...state.breakfasts,...state.lunches,...state.desserts].filter(r=>r&&r.id);
  const filtered = filterBySearch(allRecipes);

  // Sort options
  const sortBy = state.vaultSort || "name";
  const sorted = [...filtered].sort((a,b) => {
    if (sortBy === "rating") {
      const ra = (state.ratings[a.id]||{}).stars||0;
      const rb = (state.ratings[b.id]||{}).stars||0;
      return rb - ra;
    }
    if (sortBy === "protein") return (b.protein||0) - (a.protein||0);
    if (sortBy === "time") return (parseInt((a.activeTime||"99").replace(/[^0-9]/g,""))||99) - (parseInt((b.activeTime||"99").replace(/[^0-9]/g,""))||99);
    return (a.name||"").localeCompare(b.name||"");
  });

  // Group by category
  const dinners = sorted.filter(r => state.dinners.some(d=>d.id===r.id));
  const breakfasts = sorted.filter(r => state.breakfasts.some(d=>d.id===r.id));
  const lunches = sorted.filter(r => state.lunches.some(d=>d.id===r.id));
  const desserts = sorted.filter(r => state.desserts && state.desserts.some(d=>d&&d.id===r.id));

  function vaultCard(r) {
    const rating = (state.ratings[r.id]||{}).stars||0;
    const stars = rating ? "⭐".repeat(rating) : "";
    const assignedDay = Object.entries(state.weekPlan||{}).find(([d,a])=>a&&a.recipeId===r.id);
    const cookCount = (state.cookHistory||[]).filter(h=>h.recipeId===r.id).length;
    const isFav = (state.ratings[r.id]||{}).favorite;

    return `
      <div style="background:var(--surface);border-radius:14px;margin-bottom:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.06)" onclick="viewRecipeById('${r.id}')">
        <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer">
          <span style="font-size:26px;flex-shrink:0">${r.emoji||"🍽️"}</span>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px">
              <div style="font-size:15px;font-weight:600;color:var(--text)">${esc(r.name)}</div>
              ${isFav?"<span style='font-size:14px'>⭐</span>":""}
            </div>
            <div style="font-size:12px;color:var(--dim)">${r.calories||""}cal · ${r.protein||""}g protein · ${r.activeTime||""}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
              ${stars?`<span style="font-size:11px;color:var(--amber)">${stars}</span>`:""}
              ${cookCount?`<span style="font-size:11px;color:var(--dim)">Made ${cookCount}x</span>`:""}
              ${assignedDay?`<span style="font-size:11px;color:var(--green)">✅ ${assignedDay[0]}</span>`:""}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0" onclick="event.stopPropagation()">
            <button onclick="quickAssignToWeek('${r.id}')" style="padding:5px 10px;border-radius:8px;border:1px solid rgba(16,185,129,0.4);background:transparent;color:var(--green);font-size:12px;font-weight:600;cursor:pointer">+ Week</button>
            <button onclick="toggleFavorite('${r.id}')" style="padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:${isFav?"var(--amber)":"var(--dim)"};font-size:12px;cursor:pointer">${isFav?"★ Fav":"☆ Fav"}</button>
          </div>
        </div>
      </div>`;
  }

  function section(title, recipes) {
    if (!recipes.length) return "";
    return `
      <div style="margin-bottom:20px">
        <div style="font-size:13px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">${title} (${recipes.length})</div>
        ${recipes.map(vaultCard).join("")}
      </div>`;
  }

  el.innerHTML = `
    <div style="margin-bottom:14px">
      <div style="font-size:20px;font-weight:700;margin-bottom:4px">🗄️ Recipe Vault</div>
      <div style="color:var(--dim);font-size:14px">${allRecipes.length} recipes · Tap to view · + Week to assign</div>
    </div>

    ${renderSearchBar()}

    <div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px">
      ${["name","rating","protein","time"].map(s =>
        `<button onclick="state.vaultSort='${s}';renderVault()" style="padding:6px 14px;border-radius:20px;border:none;background:${(state.vaultSort||'name')===s?'var(--green)':'rgba(255,255,255,0.06)'};color:${(state.vaultSort||'name')===s?'#0a0f1a':'var(--muted)'};font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">${s==='name'?'A-Z':s==='rating'?'⭐ Rating':s==='protein'?'💪 Protein':'⏱️ Fastest'}</button>`
      ).join("")}
    </div>

    ${section("🍽️ Dinners", dinners)}
    ${section("⚡ Breakfasts", breakfasts)}
    ${section("🥗 Lunches", lunches)}
    ${section("🍫 Desserts", desserts)}
    <div style="height:30px"></div>
  `;
}

function quickAssignToWeek(recipeId) {
  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  // Find first unassigned day
  const freeDay = DAYS.find(d => !state.weekPlan[d]);
  if (freeDay) {
    const section = state.dinners.some(r=>r&&r.id===recipeId) ? "dinner" : state.breakfasts.some(r=>r&&r.id===recipeId) ? "breakfast" : "lunch";
    state.weekPlan[freeDay] = { recipeId, section };
    scheduleSave();
    renderVault();
    // Show brief confirmation
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = "✅ " + freeDay.substring(0,3);
    btn.style.background = "rgba(16,185,129,0.2)";
    setTimeout(() => { btn.textContent = orig; btn.style.background = "transparent"; }, 2000);
  } else {
    // All days taken - let user pick
    openDayPicker("");
    currentDayPickerDay = "Monday"; // fallback
  }
}

function toggleFavorite(recipeId) {
  if (!state.ratings[recipeId]) state.ratings[recipeId] = {};
  state.ratings[recipeId].favorite = !state.ratings[recipeId].favorite;
  scheduleSave();
  renderVault();
}


function renderGrocery() {
  const el = document.getElementById("page-grocery");
  const useSmartList = !state.useStaticGrocery;
  const smartCats = buildSmartGroceryList();
  const pantryNeeds = (state.needsGrocery || []);
  const smartCatsWithPantry = pantryNeeds.length
    ? [...smartCats, { cat: "🧄 Pantry Restock", items: pantryNeeds }]
    : smartCats;
  const alexaOnly = (state.alexaOnlyItems || []).map(text => ({ text, sources: ["🔵 Alexa"] }));
  const smartCatsWithAlexa = alexaOnly.length
    ? [{ cat: "🔵 From Alexa (voice-added)", items: alexaOnly }, ...smartCatsWithPantry]
    : smartCatsWithPantry;
  const displayCats = useSmartList ? smartCatsWithAlexa : GROCERY_DATA.map(({cat, items}) => ({cat, items: items.map(text => ({text, sources:[]}))}));

  // Group items by store section
  const sectionOrder = ["Produce","Proteins","Dairy & Eggs","Bread & Grains","Frozen","Pantry","Condiments","Spices & Seasonings","Other"];
  const sectionMap = {};
  displayCats.forEach(({cat, items}) => {
    items.forEach((item, i) => {
      const itemText = typeof item === "string" ? item : (item.text || "");
      const section = categorizeGroceryItem(itemText);
      if (!sectionMap[section]) sectionMap[section] = [];
      sectionMap[section].push({ item, cat, i, itemText });
    });
  });

  const cats = sectionOrder.filter(s => sectionMap[s] && sectionMap[s].length).map(section => {
    const itemHtml = sectionMap[section].map(({item, cat, i, itemText}) => {
      const key = cat + ":" + i;
      const checked = state.grocery[key] ? "checked" : "";
      const sourceText = (item && item.sources && item.sources.length) ? ' <span class="grocery-source">' + esc(item.sources[0]) + '</span>' : "";
      const note = (state.groceryNotes && state.groceryNotes[key]) ? state.groceryNotes[key] : "";
      return `<div class="grocery-item ${checked}" onclick="toggleGrocery('${esc(key)}',this)" style="flex-direction:column;align-items:flex-start">
        <div style="display:flex;align-items:center;gap:8px;width:100%">
          <div class="grocery-check ${checked}">${checked ? "✓" : ""}</div>
          <span style="flex:1">${esc(itemText)}${sourceText}</span>
          <button onclick="event.stopPropagation();openGroceryNote('${esc(key)}','${esc(note)}')" style="padding:2px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:var(--dim);font-size:11px;cursor:pointer;flex-shrink:0">${note ? "✏️" : "+"}</button>
        </div>
        ${note ? `<div style="font-size:12px;color:var(--amber);padding:3px 0 0 24px;font-style:italic">📝 ${esc(note)}</div>` : ""}
      </div>`;
    }).join("");
    return `<div class="grocery-cat"><h3>${section}</h3>${itemHtml}</div>`;
  }).join("");

  const checkedCount = Object.values(state.grocery).filter(Boolean).length;
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 8px">
      <div>
        <div style="font-size:20px;font-weight:700">🛒 This Week's Groceries</div>
        <div style="color:var(--dim);font-size:13px">${checkedCount} checked · ${displayCats.reduce((a,c)=>a+c.items.length,0)} items · ${esc(state.store)}${state.alexaSyncTime ? " · 🔵 Alexa synced " + state.alexaSyncTime : ""}</div>
      </div>
      <button onclick="clearGrocery()" style="padding:7px 12px;border-radius:10px;border:1.5px solid var(--dim);background:transparent;color:var(--dim);font-size:12px;cursor:pointer">Clear</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button onclick="copyListForClaude()" style="flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;font-weight:700;font-size:14px;cursor:pointer">📋 Copy for Claude</button>
      <button onclick="openInstacart()" style="flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:700;font-size:14px;cursor:pointer">🛒 Instacart</button>
    </div>
    <div id="copy-claude-status" style="display:none;font-size:13px;color:var(--green);text-align:center;padding:4px 0;margin-bottom:8px"></div>

    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button onclick="state.useStaticGrocery=false;scheduleSave();renderGrocery()" style="flex:1;padding:7px;border-radius:10px;border:none;background:${!useSmartList?"var(--green)":"rgba(255,255,255,0.06)"};color:${!useSmartList?"#0a0f1a":"var(--muted)"};font-weight:600;font-size:12px;cursor:pointer">✨ From recipes</button>
      <button onclick="state.useStaticGrocery=true;scheduleSave();renderGrocery()" style="flex:1;padding:7px;border-radius:10px;border:none;background:${useSmartList?"rgba(255,255,255,0.06)":"var(--amber)"};color:${useSmartList?"var(--muted)":"#0a0f1a"};font-weight:600;font-size:12px;cursor:pointer">📋 Full list</button>
    </div>
    <button onclick="syncAlexaList()" id="alexa-sync-btn" style="width:100%;padding:10px;border-radius:12px;border:1.5px solid rgba(0,168,232,0.5);background:rgba(0,168,232,0.06);color:#00a8e8;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px">
      <span>📥 Sync from Alexa shopping list</span>
      <span style="font-size:10px;font-weight:400;color:#64748b">reads your Gmail for Alexa list email</span>
    </button>
    <div id="alexa-sync-status" style="display:none;font-size:12px;margin-bottom:10px;padding:8px 12px;border-radius:8px"></div>
    ${cats}
    <div style="background:rgba(0,168,232,0.06);border:2px solid rgba(0,168,232,0.25);border-radius:14px;padding:14px 16px;margin-top:14px;margin-bottom:10px">

      <div style="display:flex;flex-direction:column;gap:8px">
        ${buildInstacartChecklist()}
      </div>
    </div>


  `;
}

function editSwap(id) { /* simplified — opens edit form */ const s = state.swaps.find(x=>x.id===id); if(s) showAddSwapModal(s); }
function deleteSwap(id) { if(!confirm("Remove this swap?")) return; state.swaps = state.swaps.filter(x=>x.id!==id); scheduleSave(); renderSwaps(); }
function editBlend(id) { const b = state.spiceBlends.find(x=>x.id===id); if(b) showAddBlendModal(b); }
function deleteBlend(id) { if(!confirm("Remove this blend?")) return; state.spiceBlends = state.spiceBlends.filter(x=>x.id!==id); scheduleSave(); renderSwaps(); }

function showAddSwapModal(s={}) {
  openModal(`
    <div class="modal-header"><div class="modal-title">${s.id?"Edit Swap":"Add Swap"}</div><button class="modal-close" onclick="closeModalForce()">✕</button></div>
    <input type="hidden" id="sw-id" value="${esc(s.id||"")}">
    ${[["Upgrade Name","sw-upgrade",s.upgrade||""],["Category","sw-cat",s.category||""],["Replaces","sw-orig",s.original||""],["Benefit","sw-benefit",s.benefit||""],["Protein Impact","sw-prot",s.protein||""],["Where to Buy","sw-where",s.where||""]].map(([l,id,v])=>`<label class="form-label">${l}</label><input class="form-input" id="${id}" value="${esc(v)}">`).join("")}
    <label class="form-label">Used In (comma separated)</label>
    <input class="form-input" id="sw-applies" value="${esc((s.applies||[]).join(", "))}">
    <label class="form-label">Notes</label>
    <textarea class="form-input" id="sw-note">${esc(s.note||"")}</textarea>
    <button class="btn-primary" onclick="saveSwap()">✅ Save</button>
  `);
}

function saveSwap() {
  const f = id => (document.getElementById(id)||{}).value||"";
  const saved = { id: f("sw-id")||uid(), upgrade:f("sw-upgrade"), category:f("sw-cat"), original:f("sw-orig"), benefit:f("sw-benefit"), protein:f("sw-prot"), where:f("sw-where"), applies:f("sw-applies").split(",").map(s=>s.trim()).filter(Boolean), note:f("sw-note"), emoji:"🔄" };
  const exists = state.swaps.find(s=>s.id===saved.id);
  state.swaps = exists ? state.swaps.map(s=>s.id===saved.id?saved:s) : [...state.swaps, saved];
  closeModalForce(); scheduleSave(); renderSwaps();
}

function showAddBlendModal(b={}) {
  openModal(`
    <div class="modal-header"><div class="modal-title">${b.id?"Edit Blend":"Add Spice Blend"}</div><button class="modal-close" onclick="closeModalForce()">✕</button></div>

function saveBlend() {
  const f = id => (document.getElementById(id)||{}).value||"";
  const saved = { id:f("bl-id")||uid(), name:f("bl-name"), rating:f("bl-rating"), replaces:f("bl-replaces"), timesSaved:f("bl-time"), where:f("bl-where"), usedFor:f("bl-for").split(",").map(s=>s.trim()).filter(Boolean), note:f("bl-note"), emoji:"🫙" };

async function syncAlexaList() {
  const btn = document.getElementById("alexa-sync-btn");
  const status = document.getElementById("alexa-sync-status");
  if (btn) btn.style.opacity = "0.6";
  setAlexaStatus("loading", "🔍 Searching Gmail for Alexa shopping list email...");

  try {
    const searchRes = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "anthropic-beta": "claude-ai-artifact-preview", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `You have access to Gmail via MCP. Search for the most recent email from Amazon Alexa containing a shopping list.
        Search query: from:alexa OR subject:"shopping list" OR subject:"Alexa" newer_than:30d
        If found, extract EVERY item from the shopping list — return them as a JSON array of strings, one item per entry.
        If not found, return {"error": "No Alexa shopping list email found in the last 30 days"}.
        Return ONLY raw JSON, no markdown, no preamble.`,
        messages: [{ role: "user", content: "Find the most recent Alexa shopping list email in my Gmail and extract all items as a JSON array." }],
        mcp_servers: [{ type: "url", url: "https://gmailmcp.googleapis.com/mcp/v1", name: "gmail" }]
      })
    });

    const data = await searchRes.json();
    const raw = (data.content||[]).find(b => b.type === "text").text || "";
    const cleaned = raw.replace(/```json|```/g, "").trim();
    const match = cleaned.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
    if (!match) throw new Error("Could not parse Gmail response");

    const parsed = JSON.parse(match[0]);

    if (parsed.error) {
      setAlexaStatus("warn", "⚠️ " + parsed.error + " — try saying \"Alexa, email me my shopping list\" first.");
      if (btn) btn.style.opacity = "1";
      return;
    }

    const alexaItems = Array.isArray(parsed) ? parsed : (parsed.items || []);
    if (!alexaItems.length) {
      setAlexaStatus("warn", "⚠️ No items found in the email. Make sure Alexa emailed your list.");
      if (btn) btn.style.opacity = "1";
      return;
    }
    setAlexaStatus("loading", `✅ Found ${alexaItems.length} Alexa items — deduplicating with recipe list...`);

    const recipeItems = buildSmartGroceryList().flatMap(c => c.items.map(i => typeof i === "string" ? i : i.text));

    const mergeRes = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "anthropic-beta": "claude-ai-artifact-preview", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `You are a grocery list deduplicator. Merge two lists into one clean combined list.
        Rules:
        - If an Alexa item is the same ingredient as a recipe item (even if worded differently), keep ONE entry — prefer the recipe version as it has quantity info.
        - If an Alexa item is NOT in the recipe list, ADD it to the combined list.
        - Normalize item names: "chix thighs" = "chicken thighs", "2% milk" = "Fairlife 2% milk" etc.
        - Return a JSON object: {"merged": ["item1","item2",...], "alexa_only": ["item1",...], "duplicates_removed": ["item1",...]}
        - merged = full deduplicated list (recipe items + unique Alexa additions)
        - alexa_only = items from Alexa that were NOT in recipe list (net new additions)
        - duplicates_removed = items that appeared in both and were collapsed
        Return ONLY raw JSON, no markdown.`,
        messages: [{
          role: "user",
          content: "Alexa list: " + JSON.stringify(alexaItems) + "\n\nRecipe list: " + JSON.stringify(recipeItems)
        }]
      })
    });

    const mergeData = await mergeRes.json();
    const mergeRaw = mergeData.content.find(b => b.type === "text").text || "";
    const mergeMatch = mergeRaw.replace(/```json|```/g, "").trim().match(/\{[\s\S]*\}/);
    if (!mergeMatch) throw new Error("Could not parse merge response");

    const mergeResult = JSON.parse(mergeMatch[0]);
    const { merged = [], alexa_only = [], duplicates_removed = [] } = mergeResult;
    state.alexaMergedList = merged;
    state.alexaOnlyItems  = alexa_only;
    state.alexaSyncTime   = new Date().toLocaleTimeString();
    scheduleSave();

    const msg = `✅ Synced! Added ${alexa_only.length} item${alexa_only.length !== 1 ? "s" : ""} from Alexa · Removed ${duplicates_removed.length} duplicate${duplicates_removed.length !== 1 ? "s" : ""} · ${merged.length} total items`;
    setAlexaStatus("ok", msg);
    renderGrocery(); // re-render to show merged list

  } catch(e) {
    console.error("Alexa sync error:", e);
    setAlexaStatus("error", "❌ " + (e.message || "Something went wrong. Try again."));
  }
  if (btn) btn.style.opacity = "1";
}

function setAlexaStatus(type, msg) {
  const el = document.getElementById("alexa-sync-status");
  if (!el) return;
  el.style.display = "block";
  const colors = { loading: "#64748b", ok: "#10b981", warn: "#f59e0b", error: "#ef4444" };
  const bgs    = { loading: "rgba(100,116,139,0.08)", ok: "rgba(16,185,129,0.08)", warn: "rgba(245,158,11,0.08)", error: "rgba(239,68,68,0.08)" };
  el.style.color = colors[type] || "#94a3b8";
  el.style.background = bgs[type] || "transparent";
  el.style.border = "1px solid " + (colors[type] || "#94a3b8") + "30";
  el.textContent = msg;
}

function buildRatingHtml(id, section) {
  const r = (state.ratings||{})[id] || {};
  const stars = r.stars || 0;

  const note = r.note || "";
  const ratedDate = r.date ? new Date(r.date).toLocaleDateString("en-US",{month:"short",day:"numeric"}) : null;

    const starHtml = [1,2,3,4,5].map(function(n) {
    var lit = n <= stars ? "lit" : "dim";
    var icon = n <= stars ? "⭐" : "☆";
    return '<button class="star-btn ' + lit + '" onclick="setStars(\'' + id + '\',\'' + section + '\',' + n + ')">' + icon + '</button>';
  }).join("");

    const chipHtml = RATING_CHIPS.map(function(c) {
    var sel = selectedChips.includes(c) ? "selected" : "";
    var safeC = c.replace(/'/g, "\\'");
    return '<button class="rating-chip ' + sel + '" onclick="toggleChip(\'' + id + '\',\'' + section + '\',\'' + safeC + '\',this)">' + c + '</button>';
  }).join("");

    var summaryHtml = "";
  if (stars) {
    var starStr = "⭐".repeat(stars) + "☆".repeat(5-stars);
    var dateStr = ratedDate ? '<span style="font-size:11px;color:var(--dim)">rated ' + ratedDate + '</span>' : "";
    var chipsStr = selectedChips.length
      ? '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px">' + selectedChips.map(function(c){ return '<span style="font-size:11px;background:rgba(16,185,129,0.1);color:var(--green);padding:2px 8px;border-radius:12px">' + c + '</span>'; }).join("") + '</div>'
      : "";
    var noteStr = note ? '<div style="font-size:12px;color:var(--muted);font-style:italic">"' + esc(note) + '"</div>' : "";
    summaryHtml = '<div class="rating-summary">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'
      + '<span style="font-size:16px">' + starStr + '</span>' + dateStr
      + '</div>' + chipsStr + noteStr + '</div>';
  }

  return `
    <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:8px">
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px">

    </div>`;
}

function setStars(id, section, stars) {
  if (!state.ratings) state.ratings = {};
  const cur = state.ratings[id] || {};
  state.ratings[id] = { ...cur, stars, date: new Date().toISOString() };
  scheduleSave();
  viewRecipe(section, id); // re-render modal
}

function toggleChip(id, section, chip) {
  if (!state.ratings) state.ratings = {};
  const cur = state.ratings[id] || {};
  const chips = cur.chips || [];
  state.ratings[id] = {
    ...cur,
    chips: chips.includes(chip) ? chips.filter(c => c !== chip) : [...chips, chip],
    date: cur.date || new Date().toISOString()
  };
  scheduleSave();
  viewRecipe(section, id);
}

let noteDebounce = null;
function debounceSaveNote(id, section) {
  clearTimeout(noteDebounce);
  noteDebounce = setTimeout(() => {
    const el = document.getElementById("rating-note-" + id);
    if (!el) return;
    if (!state.ratings) state.ratings = {};
    const cur = state.ratings[id] || {};
    state.ratings[id] = { ...cur, note: el.value, date: cur.date || new Date().toISOString() };
    scheduleSave();
  }, 600);
}
